name: Bug Report
description: Report a reproducible defect in Nessy
body:
  - type: markdown
    attributes:
      value: |
        ## 🐢 Nessy Bug Report
        Give the autonomous engineering system enough signal to reproduce and resolve the issue.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Commands, configuration, logs, or minimal reproduction.
    validations:
      required: true
