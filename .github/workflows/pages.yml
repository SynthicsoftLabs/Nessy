name: Nessy Chat Artifact

on:
  push:
    branches: [main]
    paths:
      - 'docs/chat/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nessy-chat-artifact
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish repository chat artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate chat surface
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/chat/index.html
          test -s docs/chat/runtime.json
          grep -q '<html' docs/chat/index.html
          grep -q 'Nessy' docs/chat/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('docs/chat/runtime.json').read_text())
          assert isinstance(data, dict)
          assert isinstance(data.get('runtimes'), list)
          PY

      - name: Package chat surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -a docs/chat/. dist/
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_SHA

      - name: Publish chat artifact
        uses: actions/upload-artifact@v4
        with:
          name: nessy-chat-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 90
