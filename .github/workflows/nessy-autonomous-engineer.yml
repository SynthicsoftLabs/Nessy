name: Nessy Autonomous Engineer

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows:
      - Preflight
      - Interposition Integrity
      - Nessy Chat Artifact
      - CI
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read
  copilot-requests: write

concurrency:
  group: nessy-autonomous-engineer-${{ github.event.pull_request.number || github.event.workflow_run.id || github.ref_name }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  COPILOT_GITHUB_TOKEN: ${{ github.token }}
  RUSTFLAGS: '-D warnings'

jobs:
  engineer:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout engineering target
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install engineering toolchain
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nessy Autonomous Engineer'
          git config user.email 'nessy-autonomous-engineer@users.noreply.github.com'
          gh auth status
          git status --short
          git log --oneline --graph -n 20
          test -f README.md
          test -f Cargo.toml

      - name: Install Copilot CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @github/copilot
          copilot --version

      - name: Autonomous engineering cycle
        shell: bash
        run: |
          set -euo pipefail
          copilot -p 'You are Nessy Autonomous Engineer operating inside SynthicsoftLabs/Nessy.

Execute the complete repository engineering cycle without asking a user for input.

1. Establish repository state first. Read git log --oneline --graph -n 20, README.md, AUTOMATION.md, CONTRIBUTING.md, affected files, and git blame for files you will change. Inspect the dependency graph and existing tests/workflows before editing.
2. Determine the current trigger context with gh run list, gh run view, gh pr list, git status, git branch --show-current, git rev-parse HEAD, and repository metadata. Identify the actual failure or engineering task from evidence rather than guessing.
3. Reproduce the defect before fixing it. For bugs, add or update the smallest regression test that proves the failure. Keep unrelated files untouched.
4. Trace callers, dependencies, workflow consumers, and public interfaces before changing signatures or behavior. Prefer AST-aware/compiler-backed validation over regex-only reasoning.
5. Implement the smallest complete root-cause fix. No placeholders, TODOs, commented-out dead code, hardcoded credentials, or speculative rewrites.
6. Run the full repository validation matrix locally in this job: cargo fmt --all -- --check; cargo check --workspace --all-targets; cargo test --workspace --all-targets; cargo clippy --workspace --all-targets --all-features -- -D warnings; cargo audit; cargo deny check; Node syntax/tests for docs/chat when present; repository integrity verification; and relevant project scripts.
7. If validation fails, inspect the actual failure, correct the implementation, and rerun the affected gate followed by the complete validation matrix. Continue until the tree is clean or an externally unavailable capability is conclusively identified.
8. Inspect the final diff and verify the change is atomic, idempotent, minimal, documented, and internally consistent. Confirm no merge markers, generated secrets, unexpected files, or unrelated changes exist.
9. Use a strict Conventional Commit message. Keep one logical change per commit.
10. Never push directly to main. For a pull request, work on its existing same-repository head branch when possible. For main/scheduled maintenance, create an automation/* branch from main.
11. Push the branch, create or update a pull request with an evidence-based description, and enable automatic merge when the validation gates are successful. Use gh pr checks --watch when a PR exists. Merge with squash only after the complete validation cycle succeeds.
12. After merge, verify main points at the expected commit and rerun repository integrity/readiness checks. Leave a concise execution record in the job summary.

You have no human to ask. Make the engineering decisions required to complete the task from repository evidence and existing architecture. Stop only for a genuinely unavailable external capability, and record the exact blocker and attempted route in the workflow summary.' --allow-tool='shell(git:*)' --allow-tool='shell(gh:*)' --allow-tool='shell(cargo:*)' --allow-tool='shell(node:*)' --allow-tool='shell(npm:*)' --allow-tool=write --allow-tool=edit --no-ask-user

      - name: Autonomous post-agent validation
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --porcelain)" || {
            echo 'Agent left uncommitted changes; requiring clean commit state before promotion.'
            exit 1
          }
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          if command -v cargo-audit >/dev/null; then cargo audit; fi
          if command -v cargo-deny >/dev/null; then cargo deny check; fi
          if [ -f docs/chat/app.js ]; then node --check docs/chat/app.js; fi
          if [ -f docs/chat/response-quality.js ]; then node --check docs/chat/response-quality.js; fi
          if [ -f tests/chat-response-quality.test.js ]; then node tests/chat-response-quality.test.js; fi
          if [ -f tests/chat-engineering.test.js ]; then node tests/chat-engineering.test.js; fi
          if [ -f tests/chat-model-routing.test.js ]; then node tests/chat-model-routing.test.js; fi
          bash scripts/verify-interposition.sh

      - name: Verify autonomous promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '### Nessy Autonomous Engineering' >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $(git branch --show-current)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Working tree: $(git status --porcelain | wc -l) changed paths" >> "$GITHUB_STEP_SUMMARY"
          gh pr list --state open --limit 20 --json number,title,headRefName,baseRefName,isDraft,mergeStateStatus,url >> "$GITHUB_STEP_SUMMARY" || true
