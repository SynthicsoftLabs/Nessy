name: Nessy Autonomous Engineer

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Repository issue driving this autonomous cycle'
        required: false
        type: string
      objective:
        description: 'Objective supplied by the autonomous control plane'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read
  copilot-requests: write

env:
  GH_TOKEN: ${{ github.token }}
  COPILOT_GITHUB_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RUSTFLAGS: '-D warnings'

concurrency:
  group: nessy-autonomous-engineer-${{ github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  engineer:
    name: Autonomous engineering cycle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout engineering target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Establish repository state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nessy Autonomous Engineer'
          git config user.email 'nessy-autonomous-engineer@users.noreply.github.com'
          gh auth status
          git status --short
          git log --oneline --graph -n 20
          test -f README.md
          test -f AUTOMATION.md
          test -f CONTRIBUTING.md
          test -f Cargo.toml

      - name: Resolve task evidence
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          OBJECTIVE: ${{ github.event.inputs.objective }}
        run: |
          set -euo pipefail
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue view "$ISSUE_NUMBER" --repo "$GH_REPO" --json number,title,body,url > /tmp/nessy-issue.json
          else
            printf '%s\n' '{"number":null,"title":"autonomous-maintenance","body":""}' > /tmp/nessy-issue.json
          fi
          git status --short > /tmp/nessy-status.txt
          git branch --show-current > /tmp/nessy-branch.txt
          git rev-parse HEAD > /tmp/nessy-head.txt
          git log --oneline --decorate -n 20 > /tmp/nessy-history.txt
          gh run list --repo "$GH_REPO" --limit 20 --json databaseId,name,status,conclusion,headBranch,headSha,event,createdAt > /tmp/nessy-runs.json
          gh pr list --repo "$GH_REPO" --state open --limit 20 --json number,title,headRefName,baseRefName,mergeStateStatus,url > /tmp/nessy-prs.json

      - name: Install Copilot CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @github/copilot
          copilot --version

      - name: Autonomous engineering cycle
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          OBJECTIVE: ${{ github.event.inputs.objective }}
        run: |
          set -euo pipefail
          ISSUE_CONTEXT="$(cat /tmp/nessy-issue.json)"
          RUN_CONTEXT="$(cat /tmp/nessy-runs.json)"
          PR_CONTEXT="$(cat /tmp/nessy-prs.json)"
          export ISSUE_CONTEXT ISSUE_NUMBER OBJECTIVE RUN_CONTEXT PR_CONTEXT
          copilot -p 'You are Nessy Autonomous Engineer operating inside SynthicsoftLabs/Nessy.

Execute the complete repository engineering cycle without asking a human for input.

Repository contract:
- Read git log --oneline --graph -n 20, README.md, AUTOMATION.md, CONTRIBUTING.md, affected source, tests, workflows, and git blame before editing.
- Establish the exact failure or objective from machine evidence: OBJECTIVE, ISSUE_CONTEXT, RUN_CONTEXT, PR_CONTEXT, repository state, active PRs, and workflow history.
- Reproduce observed failures before implementing fixes. Add a focused regression test before the fix where practical.
- Trace callers, dependency edges, workflow consumers, and public interfaces before changing behavior.
- Implement a complete root-cause change. No TODOs, placeholders, commented dead code, hardcoded secrets, or unrelated rewrites.
- Run the complete validation matrix: cargo fmt --all -- --check; cargo check --workspace --all-targets; cargo test --workspace --all-targets; cargo clippy --workspace --all-targets --all-features -- -D warnings; cargo audit; cargo deny check; relevant Node syntax/tests; repository integrity; and relevant project scripts.
- On failure, inspect the actual error, repair the cause, rerun the affected gate, then rerun the complete matrix.
- Inspect the final diff for atomicity, idempotency, documentation, merge markers, credentials, unrelated changes, and generated artifacts.
- Use one strict Conventional Commit for one logical change.
- Never push directly to main. When the checked-out ref is main, create an automation/* branch from main before committing repairs. When a pull-request ref is supplied, continue on that same-repository branch and keep its scope atomic.
- Push the branch, create or update the appropriate pull request, monitor all checks, and enable automatic merge when every required validation succeeds.
- After promotion, verify main points to the expected commit and rerun integrity/readiness checks against that exact SHA.
- If ISSUE_NUMBER is set, comment the exact result, commit/PR, validation result, and verified main SHA on the issue.

Do not ask for confirmation. Do not declare success from intended workflow state; verify actual GitHub state.' --allow-tool='shell(git:*)' --allow-tool='shell(gh:*)' --allow-tool='shell(cargo:*)' --allow-tool='shell(node:*)' --allow-tool='shell(npm:*)' --allow-tool=write --allow-tool=edit --no-ask-user

      - name: Autonomous post-agent validation
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --porcelain)" || { echo 'Agent left uncommitted changes.'; exit 1; }
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          if command -v cargo-audit >/dev/null; then cargo audit; fi
          if command -v cargo-deny >/dev/null; then cargo deny check; fi
          [ ! -f docs/chat/app.js ] || node --check docs/chat/app.js
          [ ! -f docs/chat/response-quality.js ] || node --check docs/chat/response-quality.js
          [ ! -f tests/chat-response-quality.test.js ] || node tests/chat-response-quality.test.js
          [ ! -f tests/chat-engineering.test.js ] || node tests/chat-engineering.test.js
          [ ! -f tests/chat-model-routing.test.js ] || node tests/chat-model-routing.test.js
          bash scripts/verify-interposition.sh

      - name: Record autonomous result
        if: always()
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          BRANCH="$(git branch --show-current)"
          echo '### Nessy Autonomous Engineer' >> "$GITHUB_STEP_SUMMARY"
          echo "- Objective: ${{ github.event.inputs.objective }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "Nessy Autonomous Engineer completed its machine-driven engineering cycle at $SHA on $BRANCH. Validation is represented by this workflow result and the repository CI gates."
          fi
