name: Nessy Autonomous Control Plane

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

concurrency:
  group: nessy-autonomous-main
  cancel-in-progress: false

jobs:
  autonomous:
    name: Autonomous engineering cycle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install autonomous coding engine
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir aider-chat
          aider --version

      - name: Execute Nessy autonomous engineering engine
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/nessy-autonomous-engineer.sh
