name: Nessy Autonomous Control Plane

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]
  workflow_run:
    workflows:
      - CI
      - Preflight
      - Integrity
      - Interposition Integrity
      - Nessy Chat Artifact
      - CodeQL
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write
  checks: read
  copilot-requests: write

concurrency:
  group: nessy-autonomous-control-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.id || github.ref_name }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  dispatch:
    name: Autonomous control and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve execution context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          event='${{ github.event_name }}'
          target_ref='main'
          issue_number=''
          objective=''

          case "$event" in
            pull_request)
              target_ref='${{ github.event.pull_request.head.ref }}'
              issue_number='${{ github.event.pull_request.number }}'
              objective="Validate and complete pull request #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
              ;;
            issues)
              issue_number='${{ github.event.issue.number }}'
              objective='${{ github.event.issue.title }}: ${{ github.event.issue.body }}'
              ;;
            workflow_run)
              target_ref='${{ github.event.workflow_run.head_branch }}'
              objective="Repair failed or reconcile completed workflow run ${{ github.event.workflow_run.id }} (${{ github.event.workflow_run.name }}, ${{ github.event.workflow_run.conclusion }}, SHA ${{ github.event.workflow_run.head_sha }}). Inspect the actual run, affected code, logs, checks, and repository state, then perform the complete engineering cycle."
              ;;
            push)
              objective='Run the complete autonomous repository audit against the new main commit. Inspect lineage, documentation, automation, runtime/chat surfaces, model/provider catalog, integrity, licensing, tests, and all active workflows. Repair every concrete defect found and promote verified fixes automatically.'
              ;;
            schedule)
              objective='Run the complete autonomous repository maintenance and health cycle. Discover latent defects, stale configuration, broken automation, dependency issues, documentation drift, runtime/chat failures, security/integrity problems, and incomplete features. Repair and validate all findings.'
              ;;
            workflow_dispatch)
              objective='Run the complete autonomous repository engineering and health cycle from current main state.'
              ;;
          esac

          echo "target_ref=$target_ref" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          {
            echo 'objective<<NESSY_OBJECTIVE'
            printf '%s\n' "$objective"
            echo 'NESSY_OBJECTIVE'
          } >> "$GITHUB_OUTPUT"

      - name: Record controller receipt
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
          OBJECTIVE: ${{ steps.context.outputs.objective }}
        run: |
          set -euo pipefail
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "Nessy Autonomous Control Plane accepted this machine event and dispatched the autonomous engineering worker."
          fi
          echo '### Nessy Autonomous Control Plane' >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target ref: ${{ steps.context.outputs.target_ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Objective: $OBJECTIVE" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch autonomous engineer
        shell: bash
        env:
          TARGET_REF: ${{ steps.context.outputs.target_ref }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
          OBJECTIVE: ${{ steps.context.outputs.objective }}
        run: |
          set -euo pipefail
          args=(--repo "$GH_REPO" --ref "$TARGET_REF" -f objective="$OBJECTIVE")
          if [ -n "$ISSUE_NUMBER" ]; then
            args+=( -f issue_number="$ISSUE_NUMBER" )
          fi
          gh workflow run nessy-autonomous-engineer.yml "${args[@]}"

      - name: Verify dispatch
        shell: bash
        env:
          TARGET_REF: ${{ steps.context.outputs.target_ref }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            run_id=$(gh run list --repo "$GH_REPO" --workflow nessy-autonomous-engineer.yml --event workflow_dispatch --limit 20 --json databaseId,headBranch,status --jq --arg ref "$TARGET_REF" '[.[] | select(.headBranch == $ref)] | .[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              echo "worker_run_id=$run_id" >> "$GITHUB_OUTPUT" 2>/dev/null || true
              echo "Worker run: $run_id" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo 'Autonomous engineer dispatch was not observable after 60 seconds.' >&2
          exit 1
