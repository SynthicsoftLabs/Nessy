name: CI

on:
  push:
    branches: [main, bowserai-foundation, bowserai-autonomous-v2]
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
      - name: Detect unresolved markers
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .
      - name: Verify dependency metadata
        run: cargo metadata --format-version 1 > /dev/null

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions-rust-lang/audit@v1

  policy:
    name: License and advisory policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  license:
    name: Project license assertion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Assert Apache-2.0-only project licensing
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^license = \"Apache-2.0\"$' Cargo.toml)" -eq 1
          cargo metadata --no-deps --format-version 1 > /tmp/nessy-metadata.json
          python3 - <<'PY'
          import json
          with open('/tmp/nessy-metadata.json', encoding='utf-8') as f:
              data = json.load(f)
          packages = data.get('packages', [])
          assert packages, 'workspace metadata contains no packages'
          bad = [(p['name'], p.get('license')) for p in packages if p.get('license') != 'Apache-2.0']
          assert not bad, f'non-Apache project package licenses: {bad}'
          PY

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
