name: CI

on:
  push:
    branches: [main, bowserai-foundation, bowserai-autonomous-v2]
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
      - name: Detect unresolved markers
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .
      - name: Verify dependency metadata
        run: cargo metadata --format-version 1 > /dev/null

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions-rust-lang/audit@v1

  policy:
    name: License and advisory policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  license:
    name: Project license assertion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Assert Apache-2.0-only project licensing
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^license = \"Apache-2.0\"$' Cargo.toml)" -eq 1
          cargo metadata --no-deps --format-version 1 > /tmp/nessy-metadata.json
          python3 - <<'PY'
          import json
          with open('/tmp/nessy-metadata.json', encoding='utf-8') as f:
              data = json.load(f)
          packages = data.get('packages', [])
          assert packages, 'workspace metadata contains no packages'
          bad = [(p['name'], p.get('license')) for p in packages if p.get('license') != 'Apache-2.0']
          assert not bad, f'non-Apache project package licenses: {bad}'
          PY

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  autonomous-supervisor:
    name: Autonomous supervisor dispatch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always()
    needs: [integrity, format, check, test, clippy, audit, policy, license, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - name: Resolve latest autonomous task
        id: task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue_number=$(gh issue list --state open --limit 20 --json number,title --jq '[.[] | select(.title | startswith("Autonomous")) | .number] | .[-1] // empty')
          if [ -z "$issue_number" ]; then
            echo 'No open autonomous task found.'
            exit 0
          fi
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Record CI supervisor receipt
        if: steps.task.outputs.issue_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "Nessy CI autonomous supervisor received the current main validation event and is dispatching the repository engineering worker."

      - name: Dispatch autonomous supervisor
        if: steps.task.outputs.issue_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run nessy-autonomous-supervisor.yml --ref main

  autonomous-pr-verifier:
    name: Autonomous PR verification
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'reopened') &&
      startsWith(github.head_ref, 'automation/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
      pull-requests: write
    steps:
      - name: Resolve autonomous task
        id: task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue_number=$(gh issue list --state open --limit 20 --json number,title --jq '[.[] | select(.title | startswith("Autonomous")) | .[-1]] | .[0].number // empty')
          if [ -z "$issue_number" ]; then
            echo 'No open autonomous task found.'
            exit 0
          fi
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Record PR verifier receipt
        if: steps.task.outputs.issue_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "Nessy CI autonomous PR verifier accepted automation/${{ github.event.pull_request.number }} and is dispatching the engineering worker against the PR branch."

      - name: Dispatch autonomous engineer on PR branch
        if: steps.task.outputs.issue_number != ''
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          gh workflow run nessy-autonomous-engineer.yml \
            --ref "$PR_BRANCH" \
            -f issue_number="$ISSUE_NUMBER" \
            -f objective="$PR_BODY"

          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --workflow nessy-autonomous-engineer.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,createdAt,headBranch \
              --jq 'map(select(.headBranch == "'"$PR_BRANCH"'")) | sort_by(.createdAt) | last | .databaseId // empty')
            if [ -n "$RUN_ID" ]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 2
          done
          test -n "${RUN_ID:-}" || { echo 'Autonomous engineer workflow was not created.'; exit 1; }

      - name: Await autonomous engineer
        if: steps.dispatch.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run watch "$RUN_ID" --exit-status --interval 5

      - name: Report autonomous PR result
        if: always() && steps.task.outputs.issue_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
        run: |
          set -euo pipefail
          if [ -z "${RUN_ID:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "The autonomous PR verifier could not create the worker run. The CI execution is recorded as failed."
            exit 1
          fi
          result=$(gh run view "$RUN_ID" --json conclusion,url,headSha)
          conclusion=$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])')
          url=$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])')
          sha=$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["headSha"])')
          gh issue comment "$ISSUE_NUMBER" --body "## Nessy autonomous PR verification\n\n- Worker: $url\n- Conclusion: **$conclusion**\n- Worker SHA: \`$sha\`\n- PR: #${{ github.event.pull_request.number }}"
