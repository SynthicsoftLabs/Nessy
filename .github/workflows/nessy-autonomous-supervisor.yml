name: Nessy Autonomous Supervisor

on:
  push:
    branches: [main]
  issues:
    types: [opened]
  workflow_run:
    workflows:
      - Interposition Integrity
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue to process'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: nessy-autonomous-supervisor-${{ github.event.issue.number || github.event.inputs.issue_number || github.event.workflow_run.id || github.ref_name }}
  cancel-in-progress: true

jobs:
  dispatch-and-verify:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve autonomous task
        id: task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ -n "$ISSUE_NUMBER" ]; then
            echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ISSUE_NUMBER=$(gh issue list --repo "$GH_REPO" --state open --limit 20 --json number,title --jq '[.[] | select(.title | startswith("Autonomous")) | .number] | .[-1] // empty')
          if [ -z "$ISSUE_NUMBER" ]; then
            echo 'No open autonomous task found.'
            exit 0
          fi
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Record supervisor receipt
        if: steps.task.outputs.issue_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "Nessy Autonomous Supervisor accepted this task and is dispatching the autonomous engineer."

      - name: Dispatch autonomous engineer
        if: steps.task.outputs.issue_number != ''
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
        run: |
          set -euo pipefail
          ISSUE_BODY=$(gh issue view "$ISSUE_NUMBER" --repo "$GH_REPO" --json body --jq '.body')
          gh workflow run nessy-autonomous-engineer.yml \
            --repo "$GH_REPO" \
            --ref main \
            -f issue_number="$ISSUE_NUMBER" \
            -f objective="$ISSUE_BODY"

          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --repo "$GH_REPO" \
              --workflow nessy-autonomous-engineer.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,createdAt,headBranch \
              --jq 'map(select(.headBranch == "main")) | sort_by(.createdAt) | last | .databaseId // empty')
            if [ -n "$RUN_ID" ]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 2
          done

          test -n "${RUN_ID:-}" || { echo 'Autonomous engineer workflow was not created.'; exit 1; }

      - name: Await autonomous engineer
        if: steps.dispatch.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run watch "$RUN_ID" --repo "$GH_REPO" --exit-status --interval 5

      - name: Verify and report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          ISSUE_NUMBER: ${{ steps.task.outputs.issue_number }}
        run: |
          set -euo pipefail
          if [ -z "${ISSUE_NUMBER:-}" ]; then
            echo 'No autonomous task was found; supervisor completed without work.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${RUN_ID:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "## Nessy autonomous engineering result\n\nThe supervisor accepted the task but could not create the autonomous engineer run. The failure is recorded for the next recovery cycle."
            exit 1
          fi
          RESULT=$(gh run view "$RUN_ID" --repo "$GH_REPO" --json conclusion,status,url,headSha,workflowName)
          CONCLUSION=$(printf '%s' "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])')
          URL=$(printf '%s' "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])')
          HEAD_SHA=$(printf '%s' "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["headSha"])')
          MAIN_SHA=$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "## Nessy autonomous engineering result\n\n- Worker: $URL\n- Worker conclusion: **$CONCLUSION**\n- Worker SHA: \`$HEAD_SHA\`\n- Current main SHA: \`$MAIN_SHA\`\n\nThe supervisor waited for the autonomous engineer workflow to finish and recorded the resulting GitHub state."
          if [ "$CONCLUSION" = "success" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --comment "Autonomous engineering cycle completed successfully and was independently recorded above."
          fi

          echo '### Nessy Autonomous Supervisor' >> "$GITHUB_STEP_SUMMARY"
          echo "- Issue: #$ISSUE_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Conclusion: $CONCLUSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker SHA: $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Main SHA: $MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
