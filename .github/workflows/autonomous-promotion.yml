name: Autonomous Promotion

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  promote:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Wait for repository validation
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100
              });
              const checks = data.check_runs.filter(c => c.name !== 'Autonomous Promotion');
              if (checks.length > 0 && checks.every(c => c.status === 'completed')) {
                const failed = checks.filter(c => c.conclusion !== 'success' && c.conclusion !== 'neutral' && c.conclusion !== 'skipped');
                if (failed.length > 0) core.setFailed(`Validation failed: ${failed.map(c => c.name).join(', ')}`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Validation checks did not complete within the bounded wait window.');
      - name: Enable autonomous merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --auto --squash --repo "${{ github.repository }}"
