name: Security Ingestion and Integrity

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact event commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify Git object database
        run: git fsck --full --strict
      - name: Collect repository observation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ingest-security-intel.py <<EOF > security-observation.jsonl
          {"source":"github-actions","event_type":"repository_integrity","object":"HEAD","expected":"$GITHUB_SHA","observed":"$(git rev-parse HEAD)","commit_sha":"$GITHUB_SHA","tree_sha":"$(git rev-parse HEAD^{tree})"}
          EOF
      - name: Verify evidence digest exists
        run: python3 -c "import json; x=json.loads(open('security-observation.jsonl').readline()); assert len(x['evidence_sha256']) == 64"
      - name: Upload security evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-observation-${{ github.run_id }}
          path: security-observation.jsonl
          retention-days: 90
