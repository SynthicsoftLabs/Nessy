[workspace]
resolver = "2"
members = [
  "crates/bowser-core",
  "crates/turtle",
  "crates/koopa",
  "crates/bowserd",
  "crates/mcp",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
version = "0.1.0"
authors = ["Synthicsoft Labs LLC"]
repository = "https://github.com/SynthicsoftLabs/Nessy"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
