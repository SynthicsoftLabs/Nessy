[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = []

[licenses]
# Nessy is Apache-2.0-only; third-party dependencies may use permissive compatible licenses.
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "CC0-1.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
