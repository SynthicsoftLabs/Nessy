<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BowserAI · Nessy</title><meta name="description" content="Chat with the Nessy intelligence fabric."><style>:root{color-scheme:dark;--bg:#07090d;--panel:#0d1118;--line:#202938;--text:#edf2f7;--muted:#8793a5;--accent:#63e6be}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#16251f,transparent 35%),radial-gradient(circle at 90% 10%,#171a35,transparent 30%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;height:100vh}#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#090c12dd}.brand{display:flex;align-items:center;gap:12px;font-weight:750}.logo{width:38px;height:38px;border:1px solid #34564d;border-radius:12px;display:grid;place-items:center;background:#0d1a16;font-size:22px}.status{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}main{width:min(920px,100%);margin:auto;padding:28px 20px;overflow:auto}.welcome{text-align:center;padding:42px 10px 20px}.welcome h1{font-size:34px;margin:0 0 8px}.welcome p{color:var(--muted)}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:24px auto}.chip{border:1px solid var(--line);background:var(--panel);color:#cbd5e1;padding:9px 13px;border-radius:999px;cursor:pointer}.messages{display:flex;flex-direction:column;gap:16px}.msg{display:flex;gap:12px;max-width:82%}.msg.user{margin-left:auto;flex-direction:row-reverse}.avatar{flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}.bubble{padding:12px 15px;border:1px solid var(--line);background:var(--panel);border-radius:16px;white-space:pre-wrap}.user .bubble{background:#15251f;border-color:#25483d}.composer{border-top:1px solid var(--line);padding:15px;background:#090c12ee}.composer form{width:min(920px,100%);margin:auto;display:flex;gap:10px}.input{flex:1;min-height:52px;max-height:160px;resize:vertical;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);padding:14px;font:inherit;outline:none}.send{border:0;border-radius:14px;padding:0 20px;background:var(--accent);color:#06110d;font-weight:800;cursor:pointer}.send:disabled{opacity:.45}.foot{width:min(920px,100%);margin:7px auto 0;color:#667286;font-size:11px;text-align:center}.hidden{display:none}@media(max-width:650px){.top{padding:0 14px}.msg{max-width:94%}.welcome{padding-top:20px}.welcome h1{font-size:28px}}</style></head><body><div id="app"><header class="top"><div class="brand"><div class="logo">🐢</div><div>BowserAI <span style="color:var(--muted);font-weight:500">· Nessy</span></div></div><div class="status"><span class="dot"></span><span id="status">Nessy fabric starting</span></div></header><main id="main"><section class="welcome" id="welcome"><h1>What are we building?</h1><p>Chat directly with the Nessy intelligence fabric.</p><div class="chips"><button class="chip">Research a problem</button><button class="chip">Plan a system</button><button class="chip">Analyze this repository</button><button class="chip">Explore AGI capabilities</button></div></section><section class="messages" id="messages"></section></main><div class="composer"><form id="form"><textarea id="input" class="input" rows="1" placeholder="Message Nessy…" autocomplete="off"></textarea><button id="send" class="send">Send</button></form><div class="foot">BowserAI · Nessy · remote runtime routing + in-browser inference</div></div></div><script type="module">
const embeddedManifest={version:5,runtimes:[{name:'kairos',base:'https://the-real-kairos.com',chat_paths:['/api/chat','/chat/api','/api/v1/chat','/v1/chat'],method:'POST',priority:100},{name:'pollinations',base:'https://gen.pollinations.ai',chat_paths:['/v1/chat/completions'],method:'POST',priority:70}],browser:{engine:'webllm',model:'Llama-3.2-1B-Instruct-q4f16_1-MLC',priority:10},capabilities:['reasoning','planning','memory','research','tools','coding','multimodal','self_evaluation','capability_routing','continuous_learning']};
const messages=document.querySelector('#messages'),input=document.querySelector('#input'),send=document.querySelector('#send'),welcome=document.querySelector('#welcome'),status=document.querySelector('#status'),main=document.querySelector('#main');let runtimes=[],history=[],engine=null,webllmPromise=null;
function add(role,text){welcome.classList.add('hidden');const row=document.createElement('div');row.className='msg '+role;const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'◉':'🐢';const b=document.createElement('div');b.className='bubble';b.textContent=text;row.append(av,b);messages.append(row);main.scrollTop=main.scrollHeight;return b}
function loadManifest(m){runtimes=[];for(const x of(m.runtimes||[])){for(const path of(x.chat_paths||[])){runtimes.push({name:x.name,url:x.base.replace(/\/$/,'')+(path==='/'?'':path),method:x.method||'POST',priority:x.priority||0})}}runtimes.sort((a,b)=>b.priority-a.priority)}
async function refreshManifest(){try{const r=await fetch('./runtime.json?v='+Date.now(),{cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error('manifest '+r.status);const m=await r.json();if(Array.isArray(m.runtimes)&&m.runtimes.length)loadManifest(m);status.textContent='Nessy runtime fabric discovered'}catch(e){console.debug('runtime manifest refresh failed; embedded manifest retained',e);status.textContent='Nessy fabric ready'}}
async function requestRemote(rt,text){const recent=history.slice(-12);if(rt.name==='pollinations'){const r=await fetch(rt.url,{method:'POST',mode:'cors',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({model:'openai',messages:recent.map(x=>({role:x.role,content:x.content}))}),signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error(rt.name+' '+r.status);const d=await r.json();return d.choices?.[0]?.message?.content||d.output||''}const r=await fetch(rt.url,{method:'POST',mode:'cors',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({message:text,messages:recent,session_id:sessionStorage.getItem('nessy_session')||crypto.randomUUID(),source:'nessy-repository-chat',capabilities:embeddedManifest.capabilities}),signal:AbortSignal.timeout(12000),credentials:'omit'});if(!r.ok)throw Error(rt.name+' '+r.status);const ct=r.headers.get('content-type')||'';const d=ct.includes('json')?await r.json():{message:await r.text()};if(d.session_id)sessionStorage.setItem('nessy_session',d.session_id);return d.message??d.output??d.response??d.content??d.choices?.[0]?.message?.content??''}
async function getBrowserEngine(){if(engine)return engine;if(!navigator.gpu)throw Error('WebGPU unavailable');if(!webllmPromise){webllmPromise=(async()=>{status.textContent='Nessy browser intelligence loading model';const mod=await import('https://esm.run/@mlc-ai/web-llm');const e=await mod.CreateMLCEngine(embeddedManifest.browser.model,{initProgressCallback:p=>{const pct=Math.round((p.progress||0)*100);status.textContent='Nessy browser intelligence '+pct+'%'}});return e})()}engine=await webllmPromise;return engine}
async function requestBrowser(){const e=await getBrowserEngine();const out=await e.chat.completions.create({messages:[{role:'system',content:'You are Nessy, the BowserAI intelligence fabric. Maintain conversational context. Answer directly, reason carefully, and continue the user objective rather than merely acknowledging it.'},...history.slice(-16).map(x=>({role:x.role,content:x.content}))],temperature:0.7,max_tokens:700});return out.choices?.[0]?.message?.content||''}
async function chat(text){add('user',text);history.push({role:'user',content:text});const b=add('assistant','Connecting to Nessy…');send.disabled=true;let answer='';for(const rt of runtimes){try{status.textContent='Nessy · '+rt.name;answer=await requestRemote(rt,text);if(answer.trim())break}catch(e){console.debug('remote runtime failed',rt.name,e)}}if(!answer.trim()){try{answer=await requestBrowser()}catch(e){console.debug('browser inference unavailable',e);answer='Nessy could not establish a live remote or browser inference runtime. The runtime diagnostics are available in the browser console.'}}b.textContent=answer.trim();history.push({role:'assistant',content:answer.trim()});status.textContent='Nessy fabric online';send.disabled=false;input.focus();main.scrollTop=main.scrollHeight}
form.onsubmit=e=>{e.preventDefault();const t=input.value.trim();if(t){input.value='';void chat(t)}};document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{input.value=c.textContent;input.focus()});loadManifest(embeddedManifest);void refreshManifest();
</script></body></html>
