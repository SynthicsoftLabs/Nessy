<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="cache-control" content="no-cache,no-store,must-revalidate">
<meta name="version" content="nessy-chat-7">
<title>BowserAI · Nessy</title>
<meta name="description" content="Chat directly with the Nessy intelligence fabric.">
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#0d1118;--line:#202938;--text:#edf2f7;--muted:#8793a5;--accent:#63e6be;--warn:#f6c453;--bad:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#16251f,transparent 35%),radial-gradient(circle at 90% 10%,#171a35,transparent 30%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;height:100vh}#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#090c12dd}.brand{display:flex;align-items:center;gap:12px;font-weight:750}.logo{width:38px;height:38px;border:1px solid #34564d;border-radius:12px;display:grid;place-items:center;background:#0d1a16;font-size:22px}.status{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}main{width:min(920px,100%);margin:auto;padding:28px 20px;overflow:auto}.welcome{text-align:center;padding:42px 10px 20px}.welcome h1{font-size:34px;margin:0 0 8px}.welcome p{color:var(--muted)}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:24px auto}.chip{border:1px solid var(--line);background:var(--panel);color:#cbd5e1;padding:9px 13px;border-radius:999px;cursor:pointer}.messages{display:flex;flex-direction:column;gap:16px}.msg{display:flex;gap:12px;max-width:82%}.msg.user{margin-left:auto;flex-direction:row-reverse}.avatar{flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}.bubble{padding:12px 15px;border:1px solid var(--line);background:var(--panel);border-radius:16px;white-space:pre-wrap}.user .bubble{background:#15251f;border-color:#25483d}.composer{border-top:1px solid var(--line);padding:15px;background:#090c12ee}.composer form{width:min(920px,100%);margin:auto;display:flex;gap:10px}.input{flex:1;min-height:52px;max-height:160px;resize:vertical;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);padding:14px;font:inherit;outline:none}.send{border:0;border-radius:14px;padding:0 20px;background:var(--accent);color:#06110d;font-weight:800;cursor:pointer}.send:disabled{opacity:.45}.foot{width:min(920px,100%);margin:7px auto 0;color:#667286;font-size:11px;text-align:center}.diag{margin:12px auto 0;width:min(920px,100%);color:#69778b;font-size:10px;text-align:center}.hidden{display:none}@media(max-width:650px){.top{padding:0 14px}.msg{max-width:94%}.welcome{padding-top:20px}.welcome h1{font-size:28px}}
</style>
</head>
<body>
<div id="app">
<header class="top"><div class="brand"><div class="logo">🐢</div><div>BowserAI <span style="color:var(--muted);font-weight:500">· Nessy</span></div></div><div class="status"><span class="dot"></span><span id="status">Nessy fabric initializing</span></div></header>
<main id="main"><section class="welcome" id="welcome"><h1>What are we building?</h1><p>Chat directly with the Nessy intelligence fabric.</p><div class="chips"><button class="chip">Research a problem</button><button class="chip">Plan a system</button><button class="chip">Analyze this repository</button><button class="chip">Explore AGI capabilities</button></div></section><section class="messages" id="messages"></section></main>
<div class="composer"><form id="form"><textarea id="input" class="input" rows="1" placeholder="Message Nessy…" autocomplete="off"></textarea><button id="send" class="send">Send</button></form><div class="foot">BowserAI · Nessy · live runtime routing + browser inference</div><div id="diag" class="diag"></div></div>
</div>
<script type="module">
const MANIFEST={version:7,runtimes:[
{name:'kairos',base:'https://the-real-kairos.com',paths:['/v1/chat/completions','/api/v1/chat/completions','/api/chat','/chat/api','/chat','/v1/chat'],priority:100,format:'openai'},
{name:'pollinations',base:'https://gen.pollinations.ai',paths:['/v1/chat/completions'],priority:70,format:'openai'}],
local:[
{name:'SmolLM2-360M-Instruct',model:'HuggingFaceTB/SmolLM2-360M-Instruct',priority:30,dtype:'q4'},
{name:'SmolLM2-135M-Instruct',model:'HuggingFaceTB/SmolLM2-135M-Instruct',priority:20,dtype:'q4'}],
capabilities:['reasoning','planning','memory','research','coding','multimodal','self_evaluation','capability_routing','continuous_learning']};
const $=s=>document.querySelector(s),messages=$('#messages'),input=$('#input'),send=$('#send'),welcome=$('#welcome'),status=$('#status'),main=$('#main'),diag=$('#diag'),form=$('#form');
let runtimes=[],history=[],localGenerator=null,localModel='',localPromise=null;
try{history=JSON.parse(sessionStorage.getItem('nessy_history')||'[]')}catch{}
function setStatus(s){status.textContent=s}
function add(role,text){welcome.classList.add('hidden');const row=document.createElement('div');row.className='msg '+role;const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'◉':'🐢';const b=document.createElement('div');b.className='bubble';b.textContent=text;row.append(av,b);messages.append(row);main.scrollTop=main.scrollHeight;return b}
function save(){sessionStorage.setItem('nessy_history',JSON.stringify(history.slice(-24)))}
function loadManifest(m){runtimes=[];for(const x of(m.runtimes||[])){for(const p of(x.paths||[]))runtimes.push({name:x.name,url:x.base.replace(/\/$/,'')+p,priority:x.priority||0,format:x.format||'openai'})}runtimes.sort((a,b)=>b.priority-a.priority);diag.textContent='Runtime graph: '+runtimes.map(x=>x.name).join(' → ')+' → browser inference'}
async function refreshManifest(){try{const r=await fetch('./runtime.json?v='+Date.now(),{cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(6000)});if(!r.ok)throw Error('HTTP '+r.status);const m=await r.json();if(Array.isArray(m.runtimes)&&m.runtimes.length)loadManifest(m);setStatus('Nessy runtime fabric discovered')}catch(e){setStatus('Nessy fabric online · embedded runtime graph');console.debug('manifest refresh failed; embedded graph retained',e)}}
function sessionId(){let id=sessionStorage.getItem('nessy_session');if(!id){id=crypto.randomUUID();sessionStorage.setItem('nessy_session',id)}return id}
async function requestRemote(rt,text){const msgs=history.slice(-16).map(x=>({role:x.role,content:x.content}));const body=rt.format==='openai'?{model:'openai',messages:msgs,stream:false,temperature:.7}:{message:text,messages:msgs,session_id:sessionId(),source:'nessy-repository-chat',capabilities:MANIFEST.capabilities};const r=await fetch(rt.url,{method:'POST',mode:'cors',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body),credentials:'omit',signal:AbortSignal.timeout(9000)});if(!r.ok)throw Error(rt.name+' '+r.status);const ct=r.headers.get('content-type')||'';const d=ct.includes('json')?await r.json():{message:await r.text()};return String(d.choices?.[0]?.message?.content??d.message??d.output??d.response??d.content??'').trim()}
async function loadLocal(model,dtype){if(localGenerator&&localModel===model)return localGenerator;if(localPromise)return localPromise;localPromise=(async()=>{setStatus('Nessy browser intelligence loading '+model);const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');env.allowLocalModels=false;env.useBrowserCache=true;const device=navigator.gpu?'webgpu':'wasm';const options={dtype,device,progress_callback:p=>{if(p?.progress!=null)setStatus('Nessy '+model+' · '+Math.round(p.progress*100)+'%')}};try{localGenerator=await pipeline('text-generation',model,options)}catch(first){if(device==='webgpu')localGenerator=await pipeline('text-generation',model,{dtype,device:'wasm',progress_callback:options.progress_callback});else throw first}localModel=model;return localGenerator})().finally(()=>{localPromise=null});return localPromise}
async function requestLocal(){let last;for(const cfg of MANIFEST.local){try{const gen=await loadLocal(cfg.model,cfg.dtype);setStatus('Nessy browser intelligence active');const msgs=[{role:'system',content:'You are Nessy, BowserAI intelligence fabric. Answer directly in plain English when asked. Maintain context. If the user asks to research, synthesize a useful answer and state what you know rather than merely acknowledging the request.'},...history.slice(-12).map(x=>({role:x.role,content:x.content}))];const out=await gen(msgs,{max_new_tokens:384,temperature:.7,do_sample:true,return_full_text:false});const item=out?.[0];const text=typeof item?.generated_text==='string'?item.generated_text:item?.generated_text?.at?.(-1)?.content||'';if(text.trim())return text.trim()}catch(e){last=e;console.debug('local model failed',cfg.model,e)}}throw last||Error('No browser model available')}
async function chat(text){add('user',text);history.push({role:'user',content:text});save();const b=add('assistant','Connecting to live intelligence…');send.disabled=true;let answer='',source='';for(const rt of runtimes){try{setStatus('Nessy · '+rt.name);answer=await requestRemote(rt,text);if(answer){source=rt.name;break}}catch(e){console.debug('remote runtime failed',rt.name,e)}}if(!answer){try{answer=await requestLocal();source='browser inference'}catch(e){console.error('all inference runtimes failed',e);answer='Nessy could not start a live inference engine in this browser. No canned response was generated. Runtime diagnostics are available in the browser console.';source='diagnostic'}}b.textContent=answer;history.push({role:'assistant',content:answer});save();setStatus(source==='diagnostic'?'Nessy runtime unavailable':'Nessy · '+source);diag.textContent='Response source: '+source+' · conversation context: '+history.length+' messages';send.disabled=false;input.focus();main.scrollTop=main.scrollHeight}
form.onsubmit=e=>{e.preventDefault();const t=input.value.trim();if(t){input.value='';void chat(t)}};input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{input.value=c.textContent;input.focus()});loadManifest(MANIFEST);void refreshManifest();
</script>
</body>
</html>
