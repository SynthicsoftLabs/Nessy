<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="BowserAI · Nessy — persistent multi-runtime AI workspace">
<meta name="theme-color" content="#07090d"><title>BowserAI · Nessy</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#0d1118;--panel2:#111722;--line:#222b39;--text:#edf2f7;--muted:#8491a5;--accent:#63e6be;--danger:#ff7182}*{box-sizing:border-box}html,body,#app{height:100%;margin:0}body{background:radial-gradient(circle at 18% 0,#183128,transparent 32%),radial-gradient(circle at 90% 8%,#181a38,transparent 28%),var(--bg);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}.app{display:grid;grid-template-columns:280px 1fr;height:100%}.side{border-right:1px solid var(--line);background:#090c12ee;display:flex;flex-direction:column}.sidehead{padding:16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}.logo{width:38px;height:38px;display:grid;place-items:center;border:1px solid #35584e;border-radius:12px;background:#0c1915;font-size:22px}.brand{font-weight:800}.brand small{display:block;color:var(--muted);font-weight:500}.new{margin:14px;border:1px solid #2c5549;background:#10211b;color:var(--text);border-radius:12px;padding:11px;cursor:pointer;font-weight:750}.side-search{margin:0 14px 10px}.side-search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:10px;outline:0}.chatlist{overflow:auto;padding:0 8px;flex:1}.chatitem{padding:10px;border-radius:10px;cursor:pointer;margin:2px 0;display:flex;justify-content:space-between;gap:8px}.chatitem:hover,.chatitem.active{background:var(--panel2)}.chatitem .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chatitem .meta{color:var(--muted);font-size:10px}.sidefoot{border-top:1px solid var(--line);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.sidefoot button,.toolbar button,.tools button{background:var(--panel);color:#cbd5e1;border:1px solid var(--line);border-radius:9px;padding:8px;cursor:pointer}.workspace{min-width:0;display:grid;grid-template-rows:62px 1fr auto}.top{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#090c12d9}.topic{font-weight:750}.topic small{display:block;color:var(--muted);font-weight:500;font-size:11px}.toolbar{display:flex;gap:6px;align-items:center}.toolbar select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}main{overflow:auto;padding:24px}.content{width:min(980px,100%);margin:auto}.welcome{text-align:center;padding:45px 10px 25px}.welcome h1{font-size:34px;margin:0 0 7px}.welcome p{color:var(--muted);margin:0}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px auto}.chip{border:1px solid var(--line);background:var(--panel);color:#cbd5e1;padding:9px 12px;border-radius:999px;cursor:pointer}.messages{display:flex;flex-direction:column;gap:18px}.msg{display:flex;gap:11px;max-width:88%}.msg.user{margin-left:auto;flex-direction:row-reverse}.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}.bubble{padding:13px 15px;border:1px solid var(--line);background:var(--panel);border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#15251f;border-color:#294e43}.actions{display:flex;gap:4px;margin-top:6px}.actions button{border:0;background:transparent;color:#69778b;font-size:11px;cursor:pointer}.composer{border-top:1px solid var(--line);background:#090c12ee;padding:10px 18px 13px}.composer-inner{width:min(980px,100%);margin:auto}.form{display:flex;gap:8px}.input{flex:1;min-height:54px;max-height:220px;resize:vertical;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);padding:14px;outline:0}.send{border:0;border-radius:14px;padding:0 18px;background:var(--accent);color:#06110d;font-weight:850;cursor:pointer}.send:disabled{opacity:.45}.tools{display:flex;gap:5px;margin-top:7px;align-items:center}.tools .grow{flex:1}.tools span{color:#667286;font-size:10px}.progress{height:3px;background:#18202b;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.diag{font-size:10px;color:#657287;text-align:center;margin-top:5px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:20}.card{width:min(700px,100%);max-height:85vh;overflow:auto;background:#0c1119;border:1px solid var(--line);border-radius:16px;padding:20px}.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 12px}.topic small{display:none}main{padding:14px}.msg{max-width:96%}}
</style></head>
<body><div id="app" class="app">
<aside class="side"><div class="sidehead"><div class="logo">🐢</div><div class="brand">BowserAI <small>· Nessy intelligence fabric</small></div></div><button id="newChat" class="new">＋ New chat</button><div class="side-search"><input id="chatSearch" placeholder="Search conversations…"></div><div id="chatList" class="chatlist"></div><div class="sidefoot"><button id="exportAll">Export</button><button id="importBtn">Import</button><button id="settingsBtn">Settings</button><button id="clearAll">Clear all</button></div></aside>
<section class="workspace"><header class="top"><div class="topic"><span id="chatTitle">New conversation</span><small id="topicMeta">Persistent session</small></div><div class="toolbar"><select id="mode"><option value="auto">Auto</option><option value="research">Research</option><option value="creative">Creative</option><option value="code">Code</option><option value="fast">Fast</option></select><select id="runtime"><option value="browser">Browser AI</option><option value="auto">Auto runtime</option><option value="kairos">Kairos</option></select><button id="shareBtn">Share</button></div><div class="status"><span class="dot"></span><span id="status">Nessy ready</span></div></header>
<main id="main"><div class="content"><section id="welcome" class="welcome"><h1>What are we building?</h1><p>Persistent conversations with real browser inference and automatic runtime redundancy.</p><div class="chips"><button class="chip">Research a problem</button><button class="chip">Plan a system</button><button class="chip">Analyze this repository</button><button class="chip">Write and improve code</button><button class="chip">Deep research this topic</button></div></section><section id="messages" class="messages"></section></div></main>
<div class="composer"><div class="composer-inner"><form id="form" class="form"><textarea id="input" class="input" rows="1" placeholder="Message Nessy…" autocomplete="off"></textarea><button id="send" class="send">Send</button></form><div class="tools"><span id="diag">Persistent history · browser inference readying</span><span class="grow"></span><span id="modelStatus">Model preparing…</span></div><div class="progress"><i id="progressBar"></i></div></div></div></section></div>
<div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div>
<script type="module">
const $=s=>document.querySelector(s),DB='nessy-v3';let db,chats=[],activeId,pipe=null,pipeModel='',loadPromise=null,loadProgress=0;
const LOCAL=[{model:'HuggingFaceTB/SmolLM2-360M-Instruct',label:'SmolLM2-360M-Instruct',dtype:'q4'},{model:'HuggingFaceTB/SmolLM2-135M-Instruct',label:'SmolLM2-135M-Instruct',dtype:'q4'}];
const uid=()=>crypto.randomUUID(),now=()=>Date.now(),cur=()=>chats.find(c=>c.id===activeId);
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('chats'))r.result.createObjectStore('chats',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function store(mode='readonly'){return db.transaction('chats',mode).objectStore('chats')}
const save=c=>new Promise((ok,no)=>{const r=store('readwrite').put(c);r.onsuccess=ok;r.onerror=()=>no(r.error)});
const all=()=>new Promise((ok,no)=>{const r=store().getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function create(){const c={id:uid(),title:'New conversation',created:now(),updated:now(),pinned:false,messages:[]};chats.unshift(c);activeId=c.id;save(c);render()}
function renderList(){const q=$('#chatSearch').value.toLowerCase(),el=$('#chatList');el.innerHTML='';[...chats].filter(c=>!q||c.title.toLowerCase().includes(q)||c.messages.some(m=>m.content.toLowerCase().includes(q))).sort((a,b)=>(b.pinned-a.pinned)||(b.updated-a.updated)).forEach(c=>{const d=document.createElement('div');d.className='chatitem '+(c.id===activeId?'active':'');d.innerHTML='<span class="title">'+esc(c.title)+'</span><span class="meta">'+c.messages.length+'</span>';d.onclick=()=>{activeId=c.id;render()};d.oncontextmenu=e=>{e.preventDefault();c.pinned=!c.pinned;save(c);renderList()};el.append(d)})}
function render(){const c=cur();if(!c)return;$('#chatTitle').textContent=c.title;$('#topicMeta').textContent=c.messages.length+' messages · stored until cleared';$('#messages').innerHTML='';$('#welcome').classList.toggle('hidden',c.messages.length>0);for(const m of c.messages){const row=document.createElement('div');row.className='msg '+m.role;row.innerHTML='<div class="avatar">'+(m.role==='user'?'◉':'🐢')+'</div><div><div class="bubble">'+esc(m.content)+'</div></div>';$('#messages').append(row)}renderList();$('#main').scrollTop=$('#main').scrollHeight;}
function add(role,content,meta={}){const c=cur(),m={id:uid(),role,content,created:now(),...meta};c.messages.push(m);c.updated=now();if(role==='user'&&c.title==='New conversation')c.title=content.slice(0,58);save(c);render();return m}
function context(){const ms=cur().messages.map(m=>({role:m.role,content:m.content}));return ms.length<=32?ms:[...ms.slice(-31)];}
function progress(info){let p=null;if(info?.status==='progress_total'&&Number.isFinite(info.progress))p=info.progress;else if(info?.status==='progress'&&Number.isFinite(info.progress))p=info.progress;if(p!==null){p=Math.max(0,Math.min(100,p));loadProgress=p;$('#progressBar').style.width=p.toFixed(1)+'%';$('#modelStatus').textContent='Model '+Math.round(p)+'%';$('#status').textContent='Nessy · loading '+Math.round(p)+'%'}}
async function loadModel(){if(pipe)return pipe;if(loadPromise)return loadPromise;loadPromise=(async()=>{let last;for(const cfg of LOCAL){try{$('#status').textContent='Nessy · loading '+cfg.label;$('#modelStatus').textContent='Model preparing…';const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');env.allowLocalModels=false;env.useBrowserCache=true;const device=navigator.gpu?'webgpu':'wasm';pipe=await pipeline('text-generation',cfg.model,{dtype:cfg.dtype,device,progress_callback:progress});pipeModel=cfg.model;loadProgress=100;$('#progressBar').style.width='100%';$('#modelStatus').textContent='Model ready';$('#status').textContent='Nessy · '+cfg.label+' ready';return pipe}catch(e){last=e;pipe=null;pipeModel='';console.error('model load failed',cfg.model,e)}}throw last||new Error('No browser model could be loaded')})().finally(()=>{loadPromise=null});return loadPromise}
async function infer(){const generator=await loadModel();const messages=[{role:'system',content:'You are Nessy, BowserAI. Answer the user directly and naturally. Continue the conversation using the supplied history. Use plain English when requested. Do not merely acknowledge an objective; perform the task.'},...context()];const out=await generator(messages,{max_new_tokens:512,temperature:0.7,do_sample:true,return_full_text:false});const text=typeof out?.[0]?.generated_text==='string'?out[0].generated_text:out?.[0]?.generated_text?.at?.(-1)?.content||'';if(!String(text).trim())throw new Error('Model returned empty output');return String(text).trim()}
async function remote(){const rts=[['https://the-real-kairos.com/v1/chat/completions','kairos']];for(const [url,name] of rts){try{$('#status').textContent='Nessy · '+name;const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'nessy',messages:context(),stream:false}),signal:AbortSignal.timeout(5000)});if(!r.ok)continue;const d=await r.json();const t=d?.choices?.[0]?.message?.content||d?.message||d?.output||'';if(String(t).trim())return {text:String(t).trim(),source:name}}catch(e){console.debug(name,e)}}return null}
async function send(text){if(!text.trim())return;add('user',text);$('#send').disabled=true;try{const pref=$('#runtime').value;let result=null;if(pref!=='browser'){result=await remote()}if(!result)result={text:await infer(),source:'browser inference'};add('assistant',result.text,{source:result.source});$('#status').textContent='Nessy · '+result.source}else{add('assistant','Inference failed: '+(e?.message||'unknown browser inference error'));$('#status').textContent='Nessy · inference error'}finally{$('#send').disabled=false;$('#input').focus()}}
$('#form').onsubmit=e=>{e.preventDefault();const t=$('#input').value;$('#input').value='';send(t)};$('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#form').requestSubmit()}};$('#newChat').onclick=create;$('#chatSearch').oninput=renderList;$('#clearAll').onclick=async()=>{if(!confirm('Clear all Nessy conversations?'))return;for(const c of chats)await new Promise(r=>{const x=store('readwrite').delete(c.id);x.onsuccess=r});chats=[];create()};$('#exportAll').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:3,chats},null,2)],{type:'application/json'}));a.download='nessy-history.json';a.click()};$('#shareBtn').onclick=()=>navigator.share?navigator.share({title:'BowserAI · Nessy',text:cur()?.messages.map(m=>(m.role==='user'?'You: ':'Nessy: ')+m.content).join('\n\n')||''):navigator.clipboard?.writeText(cur()?.messages.map(m=>m.content).join('\n\n')||'');$('#settingsBtn').onclick=()=>{$('#modalCard').innerHTML='<h2>Nessy runtime</h2><div class="row"><span>Browser inference</span><b>Enabled</b></div><div class="row"><span>Model</span><b>'+esc(pipeModel||'preparing')+'</b></div><div class="row"><span>Persistent history</span><b>IndexedDB</b></div><p>Model downloads are cached by the browser. Download progress is normalized to 0–100% and cannot display values such as 5916%.</p><button onclick="document.querySelector(\'#modal\').classList.add(\'hidden\')">Close</button>';$('#modal').classList.remove('hidden')};$('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.add('hidden')};
(async()=>{db=await openDB();chats=await all();if(!chats.length)create();else{chats.sort((a,b)=>b.updated-a.updated);activeId=chats[0].id;render()}loadModel().catch(e=>{$('#status').textContent='Nessy · model unavailable';$('#modelStatus').textContent='Model unavailable';console.error(e)})})();
</script></body></html>
