<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="BowserAI · Nessy persistent multi-runtime AI workspace">
<meta name="theme-color" content="#07090d">
<title>BowserAI · Nessy</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#0d1118;--panel2:#111722;--line:#222b39;--text:#edf2f7;--muted:#8491a5;--accent:#63e6be}*{box-sizing:border-box}html,body,#app{height:100%;margin:0}body{background:radial-gradient(circle at 18% 0,#183128,transparent 32%),radial-gradient(circle at 90% 8%,#181a38,transparent 28%),var(--bg);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}.app{display:grid;grid-template-columns:280px 1fr;height:100%}.side{border-right:1px solid var(--line);background:#090c12ee;display:flex;flex-direction:column}.sidehead{padding:16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}.brand{font-weight:800}.brand small{display:block;color:var(--muted);font-weight:500}.logo{width:38px;height:38px;display:grid;place-items:center;border:1px solid #35584e;border-radius:12px;background:#0c1915;font-size:22px}.new,.sidefoot button,.toolbar button,.tools button,.modal button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 11px;cursor:pointer}.new{margin:14px;border-color:#2c5549;background:#10211b;font-weight:750}.side-search{margin:0 14px 10px}.side-search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:10px;outline:0}.chatlist{overflow:auto;padding:0 8px;flex:1}.chatitem{padding:10px;border-radius:10px;cursor:pointer;margin:2px 0;display:flex;justify-content:space-between;gap:8px}.chatitem:hover,.chatitem.active{background:var(--panel2)}.chatitem .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chatitem .meta,.diag{color:var(--muted);font-size:10px}.sidefoot{border-top:1px solid var(--line);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.workspace{min-width:0;display:grid;grid-template-rows:62px 1fr auto}.top{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#090c12d9}.topic{font-weight:750}.topic small{display:block;color:var(--muted);font-weight:500;font-size:11px}.toolbar{display:flex;gap:6px;align-items:center}.toolbar select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}main{overflow:auto;padding:24px}.content{width:min(980px,100%);margin:auto}.welcome{text-align:center;padding:45px 10px 25px}.welcome h1{font-size:34px;margin:0 0 7px}.welcome p{color:var(--muted)}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px auto}.chip{border:1px solid var(--line);background:var(--panel);color:#cbd5e1;padding:9px 12px;border-radius:999px;cursor:pointer}.messages{display:flex;flex-direction:column;gap:18px}.msg{display:flex;gap:11px;max-width:88%}.msg.user{margin-left:auto;flex-direction:row-reverse}.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}.bubble{padding:13px 15px;border:1px solid var(--line);background:var(--panel);border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#15251f;border-color:#294e43}.actions{display:flex;gap:4px;margin-top:6px}.actions button{border:0;background:transparent;color:#69778b;font-size:11px;cursor:pointer;padding:3px}.composer{border-top:1px solid var(--line);background:#090c12ee;padding:10px 18px 13px}.composer-inner{width:min(980px,100%);margin:auto}.form{display:flex;gap:8px}.input{flex:1;min-height:54px;max-height:220px;resize:vertical;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);padding:14px;outline:0}.send{border:0;border-radius:14px;padding:0 18px;background:var(--accent);color:#06110d;font-weight:850;cursor:pointer}.send:disabled{opacity:.45}.tools{display:flex;gap:8px;margin-top:7px;align-items:center}.tools .grow{flex:1}.progress{height:4px;background:#18202b;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:20}.card{width:min(700px,100%);max-height:85vh;overflow:auto;background:#0c1119;border:1px solid var(--line);border-radius:16px;padding:20px}.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:11px 0}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 12px}.topic small{display:none}main{padding:14px}.msg{max-width:96%}}
</style>
</head>
<body>
<div id="app" class="app">
<aside class="side"><div class="sidehead"><div class="logo">🐢</div><div class="brand">BowserAI <small>· Nessy intelligence fabric</small></div></div><button id="newChat" class="new" type="button">＋ New chat</button><div class="side-search"><input id="chatSearch" placeholder="Search conversations…" autocomplete="off"></div><div id="chatList" class="chatlist"></div><div class="sidefoot"><button id="exportAll" type="button">Export</button><button id="importBtn" type="button">Import</button><button id="settingsBtn" type="button">Settings</button><button id="clearAll" type="button">Clear all</button></div></aside>
<section class="workspace"><header class="top"><div class="topic"><span id="chatTitle">New conversation</span><small id="topicMeta">Persistent session</small></div><div class="toolbar"><select id="mode" title="Response mode"><option value="auto">Auto</option><option value="research">Research</option><option value="creative">Creative</option><option value="code">Code</option><option value="fast">Fast</option></select><select id="runtime" title="Runtime"><option value="browser">Browser AI</option><option value="auto">Auto runtime</option><option value="kairos">Kairos</option><option value="pollinations">Pollinations</option></select><button id="shareBtn" type="button">Share</button></div><div class="status"><span class="dot"></span><span id="status">Nessy ready</span></div></header>
<main id="main"><div class="content"><section id="welcome" class="welcome"><h1>What are we building?</h1><p>Persistent conversations with redundant runtimes and browser inference.</p><div class="chips"><button class="chip" type="button" data-prompt="Research a problem">Research a problem</button><button class="chip" type="button" data-prompt="Plan a system">Plan a system</button><button class="chip" type="button" data-prompt="Analyze this repository">Analyze this repository</button><button class="chip" type="button" data-prompt="Write and improve code">Write and improve code</button><button class="chip" type="button" data-prompt="Deep research this topic">Deep research this topic</button></div></section><section id="messages" class="messages"></section></div></main>
<div class="composer"><div class="composer-inner"><form id="form" class="form"><textarea id="input" class="input" rows="1" placeholder="Message Nessy…" autocomplete="off"></textarea><button id="send" class="send" type="submit">Send</button></form><div class="tools"><button id="copyLast" type="button">Copy last</button><button id="regenerate" type="button">Regenerate</button><span class="grow"></span><span id="diag" class="diag">Persistent history · browser inference</span><span id="modelStatus" class="diag">Model idle</span></div><div class="progress"><i id="progressBar"></i></div></div></div></section></div>
<div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div>
<script>
(function(){'use strict';
var DB='nessy-v6',db=null,chats=[],activeId=null,engine=null,loading=null;
var MODELS=[{name:'SmolLM2-360M-Instruct',id:'HuggingFaceTB/SmolLM2-360M-Instruct',dtype:'q4'},{name:'SmolLM2-135M-Instruct',id:'HuggingFaceTB/SmolLM2-135M-Instruct',dtype:'q4'}];
var $=function(s){return document.querySelector(s)},uid=function(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()},now=function(){return Date.now()},current=function(){return chats.find(function(c){return c.id===activeId})};
function status(t){$('#status').textContent=t}function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function openDB(){return new Promise(function(resolve,reject){var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains('chats'))r.result.createObjectStore('chats',{keyPath:'id'})};r.onsuccess=function(){resolve(r.result)};r.onerror=function(){reject(r.error)}})}
function store(mode){return db.transaction('chats',mode||'readonly').objectStore('chats')}function put(c){return new Promise(function(resolve,reject){var r=store('readwrite').put(c);r.onsuccess=resolve;r.onerror=function(){reject(r.error)}})}function all(){return new Promise(function(resolve,reject){var r=store().getAll();r.onsuccess=function(){resolve(r.result||[])};r.onerror=function(){reject(r.error)}})}function del(id){return new Promise(function(resolve,reject){var r=store('readwrite').delete(id);r.onsuccess=resolve;r.onerror=function(){reject(r.error)}})}
function createChat(){var c={id:uid(),title:'New conversation',created:now(),updated:now(),pinned:false,messages:[]};chats.unshift(c);activeId=c.id;put(c).then(render)}
function renderList(){var q=$('#chatSearch').value.trim().toLowerCase(),el=$('#chatList');el.innerHTML='';chats.filter(function(c){return !q||c.title.toLowerCase().indexOf(q)>=0||c.messages.some(function(m){return m.content.toLowerCase().indexOf(q)>=0})}).sort(function(a,b){return (b.pinned-a.pinned)||(b.updated-a.updated)}).forEach(function(c){var d=document.createElement('div');d.className='chatitem '+(c.id===activeId?'active':'');d.innerHTML='<span class="title">'+esc(c.title)+'</span><span class="meta">'+c.messages.length+'</span>';d.onclick=function(){activeId=c.id;render()};d.oncontextmenu=function(e){e.preventDefault();c.pinned=!c.pinned;put(c).then(renderList)};el.appendChild(d)})}
function render(){var c=current();if(!c)return;$('#chatTitle').textContent=c.title;$('#topicMeta').textContent=c.messages.length+' messages · stored until cleared';var el=$('#messages');el.innerHTML='';$('#welcome').classList.toggle('hidden',c.messages.length>0);c.messages.forEach(function(m){var row=document.createElement('div');row.className='msg '+m.role;var av=document.createElement('div');av.className='avatar';av.textContent=m.role==='user'?'◉':'🐢';var box=document.createElement('div');var bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.content;box.appendChild(bubble);if(m.role==='assistant'){var a=document.createElement('div');a.className='actions';var cp=document.createElement('button');cp.type='button';cp.textContent='Copy';cp.onclick=function(){copyText(m.content)};a.appendChild(cp);var sh=document.createElement('button');sh.type='button';sh.textContent='Share';sh.onclick=function(){shareText(m.content)};a.appendChild(sh);box.appendChild(a)}row.append(av,box);el.appendChild(row)});renderList();$('#main').scrollTop=$('#main').scrollHeight;$('#diag').textContent='Persistent history · '+c.messages.length+' messages'}
function add(role,text,extra){var c=current(),m={id:uid(),role:role,content:text,created:now()};Object.assign(m,extra||{});c.messages.push(m);c.updated=now();if(role==='user'&&c.title==='New conversation')c.title=text.slice(0,58)+(text.length>58?'…':'');put(c).finally(render)}
function context(){var c=current();if(!c)return[];var m=c.messages.map(function(x){return{role:x.role,content:x.content}});return m.length<=32?m:m.slice(-31)}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(function(){fallbackCopy(t)})}else fallbackCopy(t)}function fallbackCopy(t){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}function shareText(t){if(navigator.share){navigator.share({title:'BowserAI · Nessy',text:t}).catch(function(){})}else copyText(t)}
function modal(html){$('#modalCard').innerHTML=html;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}
function doExport(){var blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),chats:chats},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nessy-history.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function doImport(){var i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=function(){var f=i.files&&i.files[0];if(!f)return;f.text().then(function(t){var d=JSON.parse(t);var list=Array.isArray(d.chats)?d.chats:[];return Promise.all(list.filter(function(c){return c&&c.id&&Array.isArray(c.messages)}).map(put))}).then(all).then(function(v){chats=v;activeId=chats[0]?chats[0].id:null;if(!activeId)createChat();else render()}).catch(function(e){modal('<h2>Import failed</h2><p>'+esc(e.message||String(e))+'</p><button type="button" id="closeModal">Close</button>');$('#closeModal').onclick=closeModal})};i.click()}
function clearAll(){if(!confirm('Delete every stored Nessy conversation?'))return;Promise.all(chats.map(function(c){return del(c.id)})).then(function(){chats=[];createChat()})}
function settings(){modal('<h2>Nessy settings</h2><div class="row"><span>Persistent conversations</span><b>On</b></div><div class="row"><span>Browser inference</span><b>On</b></div><div class="row"><span>Runtime failover</span><b>On</b></div><p>Conversations persist in this browser until explicitly cleared.</p><button type="button" id="closeModal">Close</button>');$('#closeModal').onclick=closeModal}
function lastAssistant(){var c=current();return c&&c.messages.slice().reverse().find(function(m){return m.role==='assistant'})}function regenerate(){var c=current(),u=c&&c.messages.slice().reverse().find(function(m){return m.role==='user'});if(u)sendMessage(u.content,true)}
function progress(v){if(!isFinite(v))return;var n=Math.max(0,Math.min(100,v));$('#progressBar').style.width=n+'%';$('#modelStatus').textContent='Model '+Math.round(n)+'%';status('Nessy · loading '+Math.round(n)+'%')}
async function loadModel(){if(engine)return engine;if(loading)return loading;loading=(async function(){var mod=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');mod.env.allowLocalModels=false;mod.env.useBrowserCache=true;var last=null;for(var i=0;i<MODELS.length;i++){var cfg=MODELS[i];try{status('Nessy · loading '+cfg.name);var device=navigator.gpu?'webgpu':'wasm';engine=await mod.pipeline('text-generation',cfg.id,{dtype:cfg.dtype,device:device,progress_callback:function(info){var p=info&&info.progress;if(!isFinite(p))p=info&&info.fraction;if(isFinite(p))progress(p<=1?p*100:p)}});$('#progressBar').style.width='100%';$('#modelStatus').textContent=cfg.name+' ready';status('Nessy · '+cfg.name+' ready');return engine}catch(e){last=e;engine=null;console.error('browser model failed',cfg.id,e)}}throw last||new Error('No browser model available')})().finally(function(){loading=null});return loading}
async function browserAnswer(){var gen=await loadModel(),mode=$('#mode').value,system='You are Nessy, BowserAI intelligence fabric. Answer directly and naturally. Use plain English when requested. Perform the task instead of merely acknowledging it. Current response mode: '+mode+'.',out=await gen([{role:'system',content:system}].concat(context()),{max_new_tokens:512,temperature:mode==='creative'?0.85:0.65,do_sample:true,return_full_text:false}),item=out&&out[0],text=typeof item.generated_text==='string'?item.generated_text:(item.generated_text&&item.generated_text[item.generated_text.length-1]&&item.generated_text[item.generated_text.length-1].content)||'';if(!String(text).trim())throw new Error('Model returned empty output');return String(text).trim()}
async function remoteAnswer(provider){var eps=provider==='pollinations'?[{name:'pollinations',url:'https://gen.pollinations.ai/v1/chat/completions'}]:[{name:'kairos',url:'https://the-real-kairos.com/v1/chat/completions'},{name:'kairos',url:'https://the-real-kairos.com/api/v1/chat/completions'},{name:'kairos',url:'https://the-real-kairos.com/api/chat'},{name:'kairos',url:'https://the-real-kairos.com/chat/api'},{name:'kairos',url:'https://the-real-kairos.com/chat'},{name:'kairos',url:'https://the-real-kairos.com/v1/chat'}];for(var i=0;i<eps.length;i++){var ep=eps[i];try{status('Nessy · '+ep.name);var r=await fetch(ep.url,{method:'POST',mode:'cors',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({model:'nessy',messages:context(),stream:false,temperature:0.65}),signal:AbortSignal.timeout(8000)});if(!r.ok)continue;var d=await r.json(),t=d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||d&&d.message||d&&d.output||d&&d.response||'';if(String(t).trim())return String(t).trim()}catch(e){console.debug(ep.url,e)}}return''}
async function sendMessage(text,isRegenerate){if(!text||!text.trim())return;if(!isRegenerate)add('user',text);$('#send').disabled=true;var answer='',source='';try{var pref=$('#runtime').value;if(pref==='auto'){answer=await remoteAnswer('kairos');if(answer)source='kairos';if(!answer){answer=await remoteAnswer('pollinations');if(answer)source='pollinations'}}else if(pref==='kairos'){answer=await remoteAnswer('kairos');if(answer)source='kairos'}else if(pref==='pollinations'){answer=await remoteAnswer('pollinations');if(answer)source='pollinations'}if(!answer){answer=await browserAnswer();source='browser inference'}add('assistant',answer,{source:source})}catch(e){console.error(e);add('assistant','Nessy inference error: '+(e&&e.message?e.message:'unknown error'),{source:'diagnostic'})}finally{$('#send').disabled=false;status(source?'Nessy · '+source:'Nessy · ready');$('#input').focus()}}
function wire(){
$('#newChat').onclick=createChat;$('#chatSearch').oninput=renderList;$('#exportAll').onclick=doExport;$('#importBtn').onclick=doImport;$('#settingsBtn').onclick=settings;$('#clearAll').onclick=clearAll;$('#shareBtn').onclick=function(){var c=current();shareText(c?c.messages.map(function(m){return(m.role==='user'?'You':'Nessy')+': '+m.content}).join('\n\n'):'')};$('#copyLast').onclick=function(){var m=lastAssistant();if(m)copyText(m.content)};$('#regenerate').onclick=regenerate;$('#form').onsubmit=function(e){e.preventDefault();var t=$('#input').value.trim();if(t){$('#input').value='';sendMessage(t,false)}};$('#input').onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#form').requestSubmit()}};document.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){var p=b.getAttribute('data-prompt');$('#input').value=p;$('#input').focus();$('#form').requestSubmit()}});$('#modal').onclick=function(e){if(e.target.id==='modal')closeModal()};$('#mode').onchange=function(){status('Nessy · mode '+this.value)};$('#runtime').onchange=function(){status('Nessy · runtime '+this.value)}}
function init(){wire();openDB().then(function(d){db=d;return all()}).then(function(v){chats=v||[];if(!chats.length)createChat();else{chats.sort(function(a,b){return b.updated-a.updated});activeId=chats[0].id;render()}}).catch(function(e){console.error(e);alert('Nessy storage failed: '+e.message)})}
window.NessyChat={send:sendMessage,newChat:createChat,exportHistory:doExport,importHistory:doImport,clearHistory:clearAll};init();
})();
</script>
</body>
</html>
