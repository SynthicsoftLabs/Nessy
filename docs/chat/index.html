<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="BowserAI · Nessy persistent multi-runtime AI workspace"><meta name="theme-color" content="#07090d"><title>BowserAI · Nessy</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#0d1118;--panel2:#111722;--line:#222b39;--text:#edf2f7;--muted:#8491a5;--accent:#63e6be}*{box-sizing:border-box}html,body,#app{height:100%;margin:0}body{background:radial-gradient(circle at 18% 0,#183128,transparent 32%),radial-gradient(circle at 90% 8%,#181a38,transparent 28%),var(--bg);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}.app{display:grid;grid-template-columns:280px 1fr;height:100%}.side{border-right:1px solid var(--line);background:#090c12ee;display:flex;flex-direction:column;min-width:0}.sidehead{padding:16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}.brand{font-weight:800}.brand small{display:block;color:var(--muted);font-weight:500}.logo{width:38px;height:38px;display:grid;place-items:center;border:1px solid #35584e;border-radius:12px;background:#0c1915;font-size:22px}.new,.sidefoot button,.toolbar button,.tools button,.modal button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 11px;cursor:pointer}.new{margin:14px;border-color:#2c5549;background:#10211b;font-weight:750}.side-search{margin:0 14px 10px}.side-search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:10px;outline:0}.chatlist{overflow:auto;padding:0 8px;flex:1}.chatitem{padding:10px;border-radius:10px;cursor:pointer;margin:2px 0;display:flex;justify-content:space-between;gap:8px;background:transparent;width:100%;text-align:left}.chatitem:hover,.chatitem.active{background:var(--panel2)}.chatitem .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chatitem .meta,.diag{color:var(--muted);font-size:10px}.sidefoot{border-top:1px solid var(--line);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.workspace{min-width:0;display:grid;grid-template-rows:62px 1fr auto}.top{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#090c12d9}.topic{font-weight:750}.topic small{display:block;color:var(--muted);font-weight:500;font-size:11px}.toolbar{display:flex;gap:6px;align-items:center}.toolbar select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}main{overflow:auto;padding:24px}.content{width:min(980px,100%);margin:auto}.welcome{text-align:center;padding:45px 10px 25px}.welcome h1{font-size:34px;margin:0 0 7px}.welcome p{color:var(--muted)}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px auto}.chip{border:1px solid var(--line);background:var(--panel);color:#cbd5e1;padding:9px 12px;border-radius:999px;cursor:pointer}.messages{display:flex;flex-direction:column;gap:18px}.msg{display:flex;gap:11px;max-width:88%}.msg.user{margin-left:auto;flex-direction:row-reverse}.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}.bubble{padding:13px 15px;border:1px solid var(--line);background:var(--panel);border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#15251f;border-color:#294e43}.actions{display:flex;gap:4px;margin-top:6px}.actions button{border:0;background:transparent;color:#69778b;font-size:11px;cursor:pointer;padding:3px}.composer{border-top:1px solid var(--line);background:#090c12ee;padding:10px 18px 13px}.composer-inner{width:min(980px,100%);margin:auto}.form{display:flex;gap:8px}.input{flex:1;min-height:54px;max-height:220px;resize:vertical;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);padding:14px;outline:0}.send{border:0;border-radius:14px;padding:0 18px;background:var(--accent);color:#06110d;font-weight:850;cursor:pointer}.send:disabled{opacity:.45}.tools{display:flex;gap:8px;margin-top:7px;align-items:center}.tools .grow{flex:1}.progress{height:4px;background:#18202b;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:20}.card{width:min(700px,100%);max-height:85vh;overflow:auto;background:#0c1119;border:1px solid var(--line);border-radius:16px;padding:20px}.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:11px 0}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 12px}.topic small{display:none}main{padding:14px}.msg{max-width:96%}}
</style>
</head>
<body>
<div id="app" class="app">
<aside class="side"><div class="sidehead"><div class="logo">🐢</div><div class="brand">BowserAI <small>· Nessy intelligence fabric</small></div></div><button id="newChat" class="new" type="button">＋ New chat</button><div class="side-search"><input id="chatSearch" placeholder="Search conversations…" autocomplete="off"></div><div id="chatList" class="chatlist"></div><div class="sidefoot"><button id="exportAll" type="button">Export</button><button id="importBtn" type="button">Import</button><button id="settingsBtn" type="button">Settings</button><button id="clearAll" type="button">Clear all</button></div></aside>
<section class="workspace"><header class="top"><div class="topic"><span id="chatTitle">New conversation</span><small id="topicMeta">Persistent session</small></div><div class="toolbar"><select id="mode" title="Response mode"><option value="auto">Auto</option><option value="research">Research</option><option value="creative">Creative</option><option value="code">Code</option><option value="fast">Fast</option></select><select id="runtime" title="Runtime"><option value="browser">Browser AI</option><option value="auto">Auto runtime</option><option value="kairos">Kairos</option><option value="pollinations">Pollinations</option></select><button id="shareBtn" type="button">Share</button></div><div class="status"><span class="dot"></span><span id="status">Loading controller…</span></div></header>
<main id="main"><div class="content"><section id="welcome" class="welcome"><h1>What are we building?</h1><p>Persistent conversations with redundant runtimes and browser inference.</p><div class="chips"><button class="chip" type="button" data-prompt="Research a problem">Research a problem</button><button class="chip" type="button" data-prompt="Plan a system">Plan a system</button><button class="chip" type="button" data-prompt="Analyze this repository">Analyze this repository</button><button class="chip" type="button" data-prompt="Write and improve code">Write and improve code</button><button class="chip" type="button" data-prompt="Deep research this topic">Deep research this topic</button></div></section><section id="messages" class="messages"></section></div></main>
<div class="composer"><div class="composer-inner"><form id="form" class="form"><textarea id="input" class="input" rows="1" placeholder="Message Nessy…" autocomplete="off"></textarea><button id="send" class="send" type="submit">Send</button></form><div class="tools"><button id="copyLast" type="button">Copy last</button><button id="regenerate" type="button">Regenerate</button><span class="grow"></span><span id="diag" class="diag">Waiting for controller…</span><span id="modelStatus" class="diag">Model idle</span></div><div class="progress"><i id="progressBar"></i></div></div></div></section></div>
<div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div>
<script src="./app.js" defer></script>
<noscript><div style="padding:12px;text-align:center">JavaScript is required for the Nessy chat interface.</div></noscript>
</body></html>
