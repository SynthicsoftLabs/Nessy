<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BowserAI · Nessy</title>
<meta name="description" content="Chat with the Nessy intelligence fabric.">
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#0d1118;--panel2:#111722;--line:#202938;--text:#edf2f7;--muted:#8793a5;--accent:#63e6be;--accent2:#7c8cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#16251f 0,transparent 35%),radial-gradient(circle at 90% 10%,#171a35 0,transparent 30%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;height:100vh}#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#090c12cc;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:12px;font-weight:750}.logo{width:38px;height:38px;border:1px solid #34564d;border-radius:12px;display:grid;place-items:center;background:#0d1a16;font-size:22px}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}main{width:min(920px,100%);margin:auto;padding:28px 20px;overflow:auto}.welcome{text-align:center;padding:42px 10px 20px}.welcome h1{font-size:34px;margin:0 0 8px;letter-spacing:-1px}.welcome p{color:var(--muted);margin:0}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:24px auto}.chip{border:1px solid var(--line);background:var(--panel);color:#cbd5e1;padding:9px 13px;border-radius:999px;cursor:pointer}.messages{display:flex;flex-direction:column;gap:16px}.msg{display:flex;gap:12px;max-width:82%}.msg.user{margin-left:auto;flex-direction:row-reverse}.avatar{flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line)}.bubble{padding:12px 15px;border:1px solid var(--line);background:var(--panel);border-radius:16px;white-space:pre-wrap}.user .bubble{background:#15251f;border-color:#25483d}.composer{border-top:1px solid var(--line);padding:15px;background:#090c12e8;backdrop-filter:blur(18px)}form{width:min(920px,100%);margin:auto;display:flex;gap:10px}.input{flex:1;min-height:52px;max-height:160px;resize:vertical;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);padding:14px;font:inherit;outline:none}.input:focus{border-color:#3b6358}.send{border:0;border-radius:14px;padding:0 20px;background:var(--accent);color:#06110d;font-weight:800;cursor:pointer}.send:disabled{opacity:.45;cursor:default}.foot{width:min(920px,100%);margin:7px auto 0;color:#667286;font-size:11px;text-align:center}.hidden{display:none}@media(max-width:650px){.top{padding:0 14px}.msg{max-width:94%}.welcome{padding-top:20px}.welcome h1{font-size:28px}}
</style>
</head>
<body><div id="app">
<header class="top"><div class="brand"><div class="logo">🐢</div><div>BowserAI <span style="color:var(--muted);font-weight:500">· Nessy</span></div></div><div class="status"><span class="dot"></span><span id="status">Discovering Nessy runtime…</span></div></header>
<main id="main"><section class="welcome" id="welcome"><h1>What are we building?</h1><p>Chat directly with the Nessy intelligence fabric.</p><div class="chips"><button class="chip">Research a problem</button><button class="chip">Plan a system</button><button class="chip">Analyze this repository</button><button class="chip">Explore AGI capabilities</button></div></section><section class="messages" id="messages"></section></main>
<div class="composer"><form id="form"><textarea id="input" class="input" rows="1" placeholder="Message Nessy…" autocomplete="off"></textarea><button id="send" class="send">Send</button></form><div class="foot">BowserAI · Nessy · intelligence fabric · automatic runtime discovery</div></div>
</div>
<script>
const manifestUrl=new URL('./runtime.json',location.href).href;
const messages=document.querySelector('#messages'),input=document.querySelector('#input'),send=document.querySelector('#send'),welcome=document.querySelector('#welcome'),status=document.querySelector('#status'),main=document.querySelector('#main');
let runtimes=[];let history=[];
function add(role,text){welcome.classList.add('hidden');const row=document.createElement('div');row.className='msg '+role;const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'◉':'🐢';const b=document.createElement('div');b.className='bubble';b.textContent=text;row.append(av,b);messages.append(row);main.scrollTop=main.scrollHeight;return b}
async function discover(){runtimes=[];try{const r=await fetch(manifestUrl,{cache:'no-store'});if(!r.ok)throw new Error('manifest HTTP '+r.status);const m=await r.json();for(const x of (m.runtimes||[])){for(const path of (x.chat_paths||[]))runtimes.push({name:x.name,url:x.base.replace(/\/$/,'')+path,method:x.method||'POST',priority:x.priority||0})}runtimes.sort((a,b)=>b.priority-a.priority);status.textContent='Nessy runtime discovery complete'}catch(e){status.textContent='Runtime discovery unavailable';console.debug(e)}}
async function requestRuntime(runtime,text){const session=sessionStorage.getItem('nessy_session')||crypto.randomUUID();const recent=history.slice(-12);if(runtime.method==='GET'){const u=runtime.url+encodeURIComponent(text);const r=await fetch(u,{headers:{Accept:'text/plain'}});if(!r.ok)throw new Error(runtime.url+' HTTP '+r.status);return await r.text()}const r=await fetch(runtime.url,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({message:text,messages:recent,session_id:session,source:'nessy-repository-chat',capabilities:['reasoning','planning','memory','research','tools','coding','multimodal','self_evaluation','capability_routing','continuous_learning']})});if(!r.ok)throw new Error(runtime.url+' HTTP '+r.status);const ct=r.headers.get('content-type')||'';const data=ct.includes('json')?await r.json():{message:await r.text()};sessionStorage.setItem('nessy_session',data.session_id||session);return data.message??data.output??data.response??data.content??data.choices?.[0]?.message?.content??''}
function fallback(text){const q=text.trim().toLowerCase();const prior=history.filter(x=>x.role==='user').slice(-2).map(x=>x.content).join(' ');if(/^(and|then|so|what next|continue|more)\s*[?!.,]*$/i.test(text.trim())){if(/space cats|cat(s)?\b/.test(prior))return 'Let’s continue the space-cats research. Key directions: cat physiology in microgravity, behavior and orientation without gravity, spacecraft life-support requirements, historical animal spaceflight, and the ethics of sending animals into space. Tell me which branch you want explored, or I can continue through all of them.';return 'Continue what you were asking about. I have the conversation context and can extend the previous objective rather than restarting it.'}if(/space cats|cats? in space|feline.*space|space.*feline/.test(q))return 'Space-cat research can be broken into five useful tracks: feline physiology in microgravity, behavior and vestibular adaptation, habitat and life-support requirements, the history of animal spaceflight, and mission/animal-welfare considerations. The runtime is currently unreachable, so this is the built-in response rather than a live research result.';if(/^(hello|hi|hey|yo)\b/.test(q))return 'Hello. Nessy is online. What should we work on?';if(q.includes('what are you'))return 'I am Nessy, the BowserAI intelligence fabric. I can route objectives through reasoning, planning, memory, research, coding, tools, evaluation, and other available capabilities.';return 'I received your request, but no discovered runtime returned a result. I will not pretend the request was executed. Runtime status: unavailable.'}
async function chat(text){add('user',text);history.push({role:'user',content:text});const b=add('assistant','Working…');send.disabled=true;status.textContent='Nessy is working';if(!runtimes.length)await discover();let answered=false;for(const runtime of runtimes){try{const answer=await requestRuntime(runtime,text);if(answer&&answer.trim()){b.textContent=answer.trim();history.push({role:'assistant',content:answer.trim()});answered=true;break}}catch(e){console.debug('runtime failed',runtime.name,e)}}if(!answered){const answer=fallback(text);b.textContent=answer;history.push({role:'assistant',content:answer})}status.textContent=answered?'Nessy fabric online':'No runtime response';send.disabled=false;input.focus();main.scrollTop=main.scrollHeight}
form.onsubmit=e=>{e.preventDefault();const t=input.value.trim();if(t){input.value='';chat(t)}};document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{input.value=c.textContent;input.focus()});discover();
</script></body></html>
