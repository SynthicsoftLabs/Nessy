<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="BowserAI · Nessy — persistent multi-runtime AI workspace"><meta name="theme-color" content="#07090d"><title>BowserAI · Nessy</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#0d1118;--panel2:#111722;--line:#222b39;--text:#edf2f7;--muted:#8491a5;--accent:#63e6be;--danger:#ff7182;--shadow:0 18px 60px #0008}*{box-sizing:border-box}html,body,#app{height:100%;margin:0}body{background:radial-gradient(circle at 18% 0,#183128,transparent 32%),radial-gradient(circle at 90% 8%,#181a38,transparent 28%),var(--bg);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}.app{display:grid;grid-template-columns:280px 1fr;height:100%}.side{border-right:1px solid var(--line);background:#090c12eF;display:flex;flex-direction:column;min-width:0}.sidehead{padding:16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}.brand{font-weight:800;font-size:16px}.brand small{display:block;color:var(--muted);font-weight:500}.logo{width:38px;height:38px;display:grid;place-items:center;border:1px solid #35584e;border-radius:12px;background:#0c1915;font-size:22px}.new{margin:14px;border:1px solid #2c5549;background:#10211b;color:var(--text);border-radius:12px;padding:11px;cursor:pointer;font-weight:750}.side-search{margin:0 14px 10px}.side-search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:10px;outline:0}.chatlist{overflow:auto;padding:0 8px;flex:1}.chatitem{padding:10px;border-radius:10px;cursor:pointer;margin:2px 0;display:flex;justify-content:space-between;gap:8px}.chatitem:hover,.chatitem.active{background:var(--panel2)}.chatitem .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chatitem .meta{color:var(--muted);font-size:10px;white-space:nowrap}.sidefoot{border-top:1px solid var(--line);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.sidefoot button,.toolbar button,.tools button{background:var(--panel);color:#cbd5e1;border:1px solid var(--line);border-radius:9px;padding:8px;cursor:pointer}.workspace{min-width:0;display:grid;grid-template-rows:62px 1fr auto}.top{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#090c12d9}.topic{font-weight:750}.topic small{display:block;color:var(--muted);font-weight:500;font-size:11px}.toolbar{display:flex;gap:6px;align-items:center}.toolbar select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}main{overflow:auto;padding:24px}.content{width:min(980px,100%);margin:auto}.welcome{text-align:center;padding:45px 10px 25px}.welcome h1{font-size:34px;margin:0 0 7px}.welcome p{color:var(--muted);margin:0}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px auto}.chip{border:1px solid var(--line);background:var(--panel);color:#cbd5e1;padding:9px 12px;border-radius:999px;cursor:pointer}.messages{display:flex;flex-direction:column;gap:18px}.msg{display:flex;gap:11px;max-width:88%;position:relative}.msg.user{margin-left:auto;flex-direction:row-reverse}.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}.bubble{padding:13px 15px;border:1px solid var(--line);background:var(--panel);border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#15251f;border-color:#294e43}.actions{display:flex;gap:4px;margin-top:6px}.actions button{border:0;background:transparent;color:#69778b;font-size:11px;cursor:pointer;padding:3px}.composer{border-top:1px solid var(--line);background:#090c12ee;padding:10px 18px 13px}.composer-inner{width:min(980px,100%);margin:auto}.attachments{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}.attachment{border:1px solid var(--line);background:var(--panel);padding:5px 8px;border-radius:8px;font-size:11px;color:#b8c3d2}.form{display:flex;gap:8px}.input{flex:1;min-height:54px;max-height:220px;resize:vertical;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);padding:14px;outline:0}.send{border:0;border-radius:14px;padding:0 18px;background:var(--accent);color:#06110d;font-weight:850;cursor:pointer}.send:disabled{opacity:.45}.tools{display:flex;gap:5px;margin-top:7px;align-items:center}.tools .grow{flex:1}.tools span{color:#667286;font-size:10px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:20}.card{width:min(700px,100%);max-height:85vh;overflow:auto;background:#0c1119;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}.card h2{margin-top:0}.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.row label{color:#cbd5e1}.row input[type=checkbox]{width:18px;height:18px}.card textarea,.card input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px}.card button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}.diag{font-size:10px;color:#657287;text-align:center;margin-top:5px}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.workspace{grid-column:1}.top{padding:0 12px}.topic small{display:none}main{padding:14px}.msg{max-width:96%}.toolbar select{max-width:115px}}
</style></head>
<body><div id="app" class="app">
<aside class="side"><div class="sidehead"><div class="logo">🐢</div><div class="brand">BowserAI <small>· Nessy intelligence fabric</small></div></div><button id="newChat" class="new">＋ New chat</button><div class="side-search"><input id="chatSearch" placeholder="Search conversations…"></div><div id="chatList" class="chatlist"></div><div class="sidefoot"><button id="exportAll">Export</button><button id="importBtn">Import</button><button id="settingsBtn">Settings</button><button id="clearAll">Clear all</button></div></aside>
<section class="workspace"><header class="top"><div class="topic"><span id="chatTitle">New conversation</span><small id="topicMeta">Persistent session</small></div><div class="toolbar"><select id="mode" title="Response mode"><option value="auto">Auto</option><option value="research">Research</option><option value="creative">Creative</option><option value="code">Code</option><option value="fast">Fast</option></select><select id="runtime" title="Runtime"><option value="auto">Auto runtime</option><option value="kairos">Kairos</option><option value="pollinations">Pollinations</option><option value="browser">Browser AI</option></select><button id="shareBtn">Share</button></div><div class="status"><span class="dot"></span><span id="status">Nessy initializing</span></div></header>
<main id="main"><div class="content"><section id="welcome" class="welcome"><h1>What are we building?</h1><p>Persistent conversations, files, research, multiple runtimes, and browser inference.</p><div class="chips"><button class="chip">Research a problem</button><button class="chip">Plan a system</button><button class="chip">Analyze this repository</button><button class="chip">Explore AGI capabilities</button><button class="chip">Write and improve code</button><button class="chip">Deep research this topic</button></div></section><section id="messages" class="messages"></section></div></main>
<div class="composer"><div class="composer-inner"><div id="attachments" class="attachments"></div><form id="form" class="form"><textarea id="input" class="input" rows="1" placeholder="Message Nessy…" autocomplete="off"></textarea><button id="send" class="send">Send</button></form><div class="tools"><button id="attachBtn" title="Attach files">＋ Files</button><button id="micBtn" title="Voice input">◉ Voice</button><button id="webBtn" title="Web research">◎ Web <span id="webState">off</span></button><button id="memoryBtn" title="Memory">◈ Memory</button><span class="grow"></span><span id="diag">Persistent local history · multi-runtime routing</span></div><input id="fileInput" type="file" multiple hidden></div></div></section></div>
<div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div>
<script type="module">
const MANIFEST={runtimes:[{name:'kairos',base:'https://the-real-kairos.com',paths:['/v1/chat/completions','/api/v1/chat/completions','/api/chat','/chat/api','/chat','/v1/chat'],priority:100,format:'openai'},{name:'pollinations',base:'https://gen.pollinations.ai',paths:['/v1/chat/completions'],priority:70,format:'openai'}],local:[{name:'SmolLM2-360M-Instruct',model:'HuggingFaceTB/SmolLM2-360M-Instruct',priority:30,dtype:'q4'},{name:'SmolLM2-135M-Instruct',model:'HuggingFaceTB/SmolLM2-135M-Instruct',priority:20,dtype:'q4'}]};
const $=s=>document.querySelector(s),messagesEl=$('#messages'),input=$('#input'),send=$('#send'),welcome=$('#welcome'),status=$('#status'),main=$('#main'),diag=$('#diag'),chatList=$('#chatList'),attachmentsEl=$('#attachments');let runtimes=[],engine=null,engineModel='',enginePromise=null,web=false,files=[],activeId=null,chats=[],db;
const DB_NAME='nessy-v2',DB_VER=1;
function uid(){return crypto.randomUUID()}
function now(){return Date.now()}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('chats')){const s=d.createObjectStore('chats',{keyPath:'id'});s.createIndex('updated','updated')}if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function putChat(c){return new Promise((res,rej)=>{const r=tx('chats','readwrite').put(c);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function getChats(){return new Promise((res,rej)=>{const r=tx('chats').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function delChat(id){return new Promise((res,rej)=>{const r=tx('chats','readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function saveActive(){const c=chats.find(x=>x.id===activeId);if(c){c.updated=now();putChat(c);renderList()}}
function createChat(){const c={id:uid(),title:'New conversation',created:now(),updated:now(),pinned:false,instructions:'',mode:'auto',messages:[],files:[]};chats.unshift(c);activeId=c.id;putChat(c);renderList();renderChat()}
function current(){return chats.find(x=>x.id===activeId)}
function renderList(){const q=$('#chatSearch').value.toLowerCase();chatList.innerHTML='';chats.filter(c=>!q||c.title.toLowerCase().includes(q)||c.messages.some(m=>m.content.toLowerCase().includes(q))).sort((a,b)=>(b.pinned-a.pinned)||(b.updated-a.updated)).forEach(c=>{const d=document.createElement('div');d.className='chatitem '+(c.id===activeId?'active':'');d.innerHTML='<span class="title">'+esc(c.title)+'</span><span class="meta">'+new Date(c.updated).toLocaleDateString()+'</span>';d.onclick=()=>{activeId=c.id;renderList();renderChat()};d.oncontextmenu=e=>{e.preventDefault();c.pinned=!c.pinned;saveActive()};chatList.append(d)})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderChat(){const c=current();if(!c)return;$('#chatTitle').textContent=c.title;$('#topicMeta').textContent=c.messages.length+' messages · stored until cleared';messagesEl.innerHTML='';welcome.classList.toggle('hidden',c.messages.length>0);for(const m of c.messages)renderMessage(m);main.scrollTop=main.scrollHeight;diag.textContent='Persistent history · '+c.messages.length+' messages · '+(c.files?.length||0)+' files'}
function renderMessage(m){const row=document.createElement('div');row.className='msg '+m.role;const av=document.createElement('div');av.className='avatar';av.textContent=m.role==='user'?'◉':'🐢';const wrap=document.createElement('div');const b=document.createElement('div');b.className='bubble';b.textContent=m.content;wrap.append(b);if(m.role==='assistant'){const a=document.createElement('div');a.className='actions';[['Copy',()=>navigator.clipboard?.writeText(m.content)],['Regenerate',()=>regenerate(m)],['Share',()=>shareText(m.content)]].forEach(([t,f])=>{const x=document.createElement('button');x.textContent=t;x.onclick=f;a.append(x)});wrap.append(a)}row.append(av,wrap);messagesEl.append(row)}
function addMessage(role,content,meta={}){const c=current();const m={id:uid(),role,content,created:now(),...meta};c.messages.push(m);if(role==='user'&&c.title==='New conversation')c.title=content.slice(0,58)+(content.length>58?'…':'');saveActive();renderChat();return m}
function loadManifest(m){runtimes=[];for(const x of(m.runtimes||[]))for(const p of(x.paths||[]))runtimes.push({name:x.name,url:x.base.replace(/\/$/,'')+p,priority:x.priority||0,format:x.format||'openai'});runtimes.sort((a,b)=>b.priority-a.priority)}
async function refreshManifest(){try{const r=await fetch('./runtime.json?v='+now(),{cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(6000)});if(r.ok){const m=await r.json();if(m.runtimes?.length)loadManifest(m)}}catch{}setStatus('Nessy fabric online')}
function setStatus(s){status.textContent=s}
async function remote(rt){const c=current();const recent=context(c);const body=rt.format==='openai'?{model:'openai',messages:recent,stream:false,temperature:c.mode==='creative'?0.9:0.65}:{message:recent.at(-1)?.content||'',messages:recent,session_id:sessionStorage.getItem('nessy_session')||uid(),source:'nessy-repository-chat'};const r=await fetch(rt.url,{method:'POST',mode:'cors',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body),credentials:'omit',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error(rt.name+' '+r.status);const d=(r.headers.get('content-type')||'').includes('json')?await r.json():{message:await r.text()};return String(d.choices?.[0]?.message?.content??d.message??d.output??d.response??d.content??'').trim()}
function context(c){const msgs=c.messages.map(m=>({role:m.role,content:m.content}));if(msgs.length<=20)return msgs;const last=msgs.slice(-12),q=last.at(-1)?.content.toLowerCase()||'';const scored=msgs.slice(0,-12).map((m,i)=>({m,score:q.split(/\W+/).filter(Boolean).reduce((n,w)=>n+(m.content.toLowerCase().includes(w)?1:0),0),i})).sort((a,b)=>b.score-a.score).slice(0,8).sort((a,b)=>a.i-b.i).map(x=>x.m);return [...scored,...last]}
async function local(){let last;for(const cfg of MANIFEST.local){try{if(!engine||engineModel!==cfg.model){if(enginePromise)await enginePromise;enginePromise=(async()=>{setStatus('Loading browser model '+cfg.name);const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');env.allowLocalModels=false;env.useBrowserCache=true;try{return await pipeline('text-generation',cfg.model,{dtype:cfg.dtype,device:navigator.gpu?'webgpu':'wasm'})}catch(e){return await pipeline('text-generation',cfg.model,{dtype:cfg.dtype,device:'wasm'})}})();engine=await enginePromise;engineModel=cfg.model;enginePromise=null}const msgs=[{role:'system',content:'You are Nessy, BowserAI intelligence fabric. Continue the conversation naturally, answer directly, use plain English when requested, and perform the requested task rather than merely acknowledging it.'},...context(current())];const out=await engine(msgs,{max_new_tokens:600,temperature:.7,do_sample:true,return_full_text:false});const t=typeof out?.[0]?.generated_text==='string'?out[0].generated_text:out?.[0]?.generated_text?.at?.(-1)?.content||'';if(t.trim())return t.trim()}catch(e){last=e;engine=null;engineModel='';console.debug('local engine',cfg.name,e)}}throw last||Error('browser inference unavailable')}
async function sendMessage(text){const c=current();if(!text.trim())return;addMessage('user',text);files=[];attachmentsEl.innerHTML='';send.disabled=true;let answer='',source='';const pref=$('#runtime').value;const candidates=pref==='auto'?runtimes:runtimes.filter(r=>r.name===pref);if(pref==='browser')candidates.length=0;for(const rt of candidates){try{setStatus('Nessy · '+rt.name);answer=await remote(rt);if(answer){source=rt.name;break}}catch(e){console.debug('runtime failed',rt.name,e)}}if(!answer){try{answer=await local();source='browser inference'}catch(e){console.error(e);source='diagnostic';answer='No live inference engine is available in this browser session. Nothing has been fabricated as an answer. Use the runtime diagnostics in Settings to inspect the failed routes.')}}addMessage('assistant',answer,{source});setStatus('Nessy · '+source);send.disabled=false;input.focus()}
async function fileRead(f){if(f.size>10*1024*1024)return '[File '+f.name+' exceeds the 10 MB browser-context preview limit.]';if(f.type.startsWith('text/')||/\.(md|txt|json|csv|rs|ts|tsx|js|jsx|py|toml|yaml|yml|xml|html|css|sql|sh)$/i.test(f.name))return await f.text();return '[Binary attachment: '+f.name+' ('+f.type+')]'}
$('#attachBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{for(const f of e.target.files){const text=await fileRead(f);files.push({name:f.name,text});const c=current();c.files.push({id:uid(),name:f.name,size:f.size,created:now(),text});attachmentsEl.innerHTML+=`<span class="attachment">📎 ${esc(f.name)}</span>`}saveActive()};
$('#webBtn').onclick=()=>{web=!web;$('#webState').textContent=web?'on':'off';$('#webBtn').style.borderColor=web?'#63e6be':'var(--line)'};
$('#micBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Browser voice input is unavailable.');return}const r=new SR();r.lang=navigator.language||'en-US';r.interimResults=false;r.onresult=e=>{input.value+=(input.value?' ':'')+e.results[0][0].transcript};r.start()};
$('#memoryBtn').onclick=()=>showMemory();
$('#newChat').onclick=createChat;$('#chatSearch').oninput=renderList;
$('#clearAll').onclick=async()=>{if(!confirm('Delete every stored Nessy conversation and its local memory?'))return;for(const c of [...chats])await delChat(c.id);chats=[];createChat()};
$('#exportAll').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,exported:new Date().toISOString(),chats},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nessy-history.json';a.click();URL.revokeObjectURL(a.href)};
$('#importBtn').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{const data=JSON.parse(await i.files[0].text());for(const c of data.chats||[]){if(c.id&&Array.isArray(c.messages)){await putChat(c);chats.push(c)}}renderList();if(!activeId&&chats[0])activeId=chats[0].id;renderChat()}catch(e){alert('Invalid Nessy history export.')}};i.click()};
$('#settingsBtn').onclick=()=>showSettings();
$('#shareBtn').onclick=()=>shareText(current()?.messages.map(m=>(m.role==='user'?'You':'Nessy')+': '+m.content).join('\n\n')||'');
function shareText(t){if(navigator.share){navigator.share({title:'BowserAI · Nessy',text:t}).catch(()=>{})}else navigator.clipboard?.writeText(t)}
function showMemory(){const c=current();showModal(`<h2>Conversation memory</h2><p>Nessy keeps the complete conversation and attached text in persistent browser storage until you explicitly clear or export it. The model receives a relevance-ranked slice plus recent messages so long sessions remain usable without deleting history.</p><div class="row"><label>Messages stored</label><b>${c.messages.length}</b></div><div class="row"><label>Files stored</label><b>${c.files?.length||0}</b></div><div class="row"><label>Session ID</label><code>${esc(c.id)}</code></div><button onclick="document.querySelector('#modal').classList.add('hidden')">Close</button>`)}
function showSettings(){showModal(`<h2>Nessy settings</h2><div class="row"><label>Persistent local history</label><input type="checkbox" checked disabled></div><div class="row"><label>Automatic runtime routing</label><input type="checkbox" checked disabled></div><div class="row"><label>Browser inference fallback</label><input type="checkbox" checked disabled></div><div class="row"><label>Web research preference</label><input id="webPref" type="checkbox" ${web?'checked':''}></div><p style="color:var(--muted)">History is stored in IndexedDB and remains until you explicitly clear it. Export creates a portable JSON backup. Long conversations are retained in full; context selection is performed only when constructing a model request.</p><button onclick="document.querySelector('#modal').classList.add('hidden')">Close</button>`)}
function showModal(html){$('#modalCard').innerHTML=html;$('#modal').classList.remove('hidden')}
$('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.add('hidden')};
async function regenerate(m){const c=current();const idx=c.messages.findIndex(x=>x.id===m.id);if(idx<1)return;c.messages.splice(idx,1);await putChat(c);renderChat();await sendMessage(c.messages[idx-1]?.content||'')}
async function init(){loadManifest(MANIFEST);try{db=await openDB();chats=await getChats()}catch(e){console.error(e);chats=[]}if(!chats.length)createChat();else{activeId=chats.sort((a,b)=>b.updated-a.updated)[0].id;renderList();renderChat()}void refreshManifest()}init();
</script></body></html>
